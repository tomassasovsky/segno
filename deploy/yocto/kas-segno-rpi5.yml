# kas project: the Segno appliance image for the raspberrypi5, booting from an
# NVMe SSD in the M.2 slot of the carrier board (#799).
#
#   ./kas-container build deploy/yocto/kas-segno-rpi5.yml
#
# The Pi 4 / SD variant is kas-segno-rpi4.yml. Everything the two boards share
# lives in kas-segno-common.yml — put changes there unless they are genuinely
# board-specific. See README.md for the full flow.
#
# DEVICE-SIDE PREREQUISITES, not shippable in this image. The bootloader EEPROM
# lives on the board, not on the drive, so nothing written here can set it — and
# an image that cannot be reached is indistinguishable from one that is broken.
# From the OS currently on the board (once, per board):
#
#   sudo rpi-eeprom-config --edit
#     BOOT_ORDER=0xf416      # else the firmware never looks at the NVMe
#     PSU_MAX_CURRENT=5000   # else USB is capped, see usb_max_current_enable below
#
# BOOT_ORDER reads right-to-left: 6=NVMe, 1=SD, 4=USB, f=restart the loop.
header:
  version: 14
  includes:
    - kas-segno-common.yml

machine: raspberrypi5

local_conf_header:
  segno-board: |
    # The block device the image is flashed to and boots from. Threaded through
    # the WIC layout, the RAUC slot table and the per-slot cmdline.txt so the
    # three can never disagree — see meta-segno/wic/segno-tryboot.wks.in.
    SEGNO_BOOT_DISK = "nvme0n1"

    # RAUC compatible string. Deliberately per-board: a Pi 4 bundle installing
    # itself onto a Pi 5 would brick the slot it landed in, so the two products
    # carry different strings and RAUC refuses the mismatch.
    SEGNO_RAUC_COMPATIBLE = "segno-raspberrypi5"

  rpi5-power: |
    # Lift the USB current cap. A Pi 5 that cannot confirm its supply is 5 A
    # budgets 600 mA across ALL USB ports; this console runs a hub, a touch
    # controller, the pedal and a Scarlett off that budget. #740 has the
    # interface enumerating and dropping off the bus 358 times in 85 minutes
    # with EPROTO faults, and names a marginal shared supply as a prime
    # suspect — 600 mA would explain it exactly.
    #
    # This is HALF the fix and the weaker half. The firmware still needs
    # PSU_MAX_CURRENT=5000 in the EEPROM (see the header) to believe the supply;
    # this flag only stops it from capping when it cannot tell. Both want a real
    # 5 V/5 A supply behind them — set on a 3 A brick, a heavily loaded bus
    # browns the board out instead of politely refusing the current.
    RPI_EXTRA_CONFIG:append = "\nusb_max_current_enable=1"

  rpi5-fan: |
    # Fan curve, chosen for a stage instrument rather than a desktop (#801).
    #
    # The stock Pi 5 curve first trips at 50 C. This image pins
    # cpufreq.default_governor=performance for audio latency, so the CPU never
    # downclocks and 50 C is crossed during ordinary playing — meaning the stock
    # curve spins the fan up during a loud passage and lets it fall away during a
    # quiet one. A fan that surges in time with the music is far more distracting,
    # and far harder for a gate to reject, than one that simply hums.
    #
    # So: hold the lowest speed essentially always (trip 0 at 30 C, which the
    # board is above the moment it boots), then do nothing until 68 C — well past
    # normal operating temperature — and reach full speed at 78 C, before the
    # 80 C soft throttle rather than at it. Temps in millidegrees, speed 0-255.
    #
    # PROVISIONAL. These are reasoned starting values, not measured ones: the
    # steady-state temperature of this board, under this governor, inside the
    # enclosure, is not known yet. #801 carries the bench measurement.
    RPI_EXTRA_CONFIG:append = "\ndtparam=fan_temp0=30000\ndtparam=fan_temp0_hyst=5000\ndtparam=fan_temp0_speed=70"
    RPI_EXTRA_CONFIG:append = "\ndtparam=fan_temp1=68000\ndtparam=fan_temp1_hyst=8000\ndtparam=fan_temp1_speed=125"
    RPI_EXTRA_CONFIG:append = "\ndtparam=fan_temp2=74000\ndtparam=fan_temp2_hyst=5000\ndtparam=fan_temp2_speed=180"
    RPI_EXTRA_CONFIG:append = "\ndtparam=fan_temp3=78000\ndtparam=fan_temp3_hyst=5000\ndtparam=fan_temp3_speed=255"

  rpi5-pcie: |
    # The Pi 5's PCIe lane — and therefore the M.2 slot the rootfs lives on — is
    # OFF unless config.txt asks for it. Without dtparam=pciex1 the firmware can
    # still boot from NVMe, but the kernel never enumerates the controller and
    # the root device it was told to mount does not exist.
    #
    # Gen 3 is above the officially qualified Gen 2 rate. It is what the carrier
    # is sold for and what the drive can do; drop this line first if the NVMe
    # link proves flaky under load.
    RPI_EXTRA_CONFIG:append = "\ndtparam=pciex1\ndtparam=pciex1_gen=3"
