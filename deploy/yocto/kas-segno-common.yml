# Shared kas config for every Segno appliance image. Machine-specific projects
# include this and add the bits that differ per board:
#
#   kas-segno-rpi4.yml   raspberrypi4-64, boots from the SD card  (mmcblk0)
#   kas-segno-rpi5.yml   raspberrypi5,    boots from NVMe         (nvme0n1)
#
# Build one of those, never this file directly. See README.md for the flow.
header:
  version: 14

distro: poky

# Pass release metadata through to the segno-bundle recipe. Without declaring
# these here, a shell `SEGNO_BUILD_VERSION=N` / `SEGNO_UPDATE_CHANNEL=C` never
# reaches bitbake (not in BB_ENV_PASSTHROUGH_ADDITIONS), so the image stamps
# the recipe defaults ("0" / "production") and experimental builds silently
# poll the production channel (#308). CI exports both.
env:
  SEGNO_BUILD_VERSION: "0"
  SEGNO_UPDATE_CHANNEL: "production"

target:
  - segno-kiosk-image

# Every upstream layer is pinned to a COMMIT, not just a branch.
#
# Without this each build fetched whatever happened to be on `walnascar` at
# that moment, so two builds of the same segno commit could ship different
# kernels, different WiFi firmware and different NetworkManager — and a
# regression could appear in a release with no matching change in this repo.
# During #459 the console demonstrably worked on 0.1.0-experimental.42 and
# failed on every build after it, and there was no way to tell from the
# repository whether anything underneath had moved. Bisecting our own history
# could never have found it.
#
# Bumps are now explicit, reviewable commits. Refresh with:
#
#   git ls-remote <url> refs/heads/walnascar
#
# See #465.
repos:
  # This repo (contains meta-segno). No url => the repo holding this kas file.
  segno:
    layers:
      deploy/yocto/meta-segno:

  poky:
    url: https://git.yoctoproject.org/poky
    branch: walnascar
    commit: d0b46a6624ec9c61c47270745dd0b2d5abbe6ac1
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: walnascar
    commit: 07330a98cf93806b7a4e0170a541b94962ff3960
    layers:
      meta-oe:
      meta-python:
      meta-multimedia:
      # NetworkManager (Control Center WiFi — join/retry + clear auth errors).
      meta-networking:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: walnascar
    commit: 0f68e8754514d64f2fe5480195b8992f341d54af

  # RAUC (A/B atomic updates). The tryboot bits (wks, WIC selector plugin, cmdline
  # class, bootloader backend, bundle recipe) are vendored INTO meta-segno rather
  # than adding Koch's meta-raspberrypi-tryboot (scarthgap-only). See #303.
  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    branch: walnascar
    commit: a0b83842d131093e89fa4fefaaa1997f05afdf62

local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    # Lean image: drop docs/dev/dbg splits for a spike.
    INHERIT += "rm_work"
    # Accept the Pi 4/5 WiFi firmware's restricted license (meta-raspberrypi).
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

  init: |
    # systemd so we can order the app after weston with a unit.
    INIT_MANAGER = "systemd"

  kiosk-console: |
    # Keep the kernel console OFF the HDMI framebuffer so it never paints over
    # weston (on-device, audit + console spam covered the app). fbcon=map:9 moves
    # the framebuffer console away, audit=0 kills the audit flood, quiet/loglevel
    # trim kernel noise, and vt.global_cursor_default=0 hides the text cursor.
    #
    # video=HDMI-A-*:1920x1080@60D forces both HDMI connectors to 1080p at boot
    # (the firmware/EDID default is the TV's 4K preferred mode) AND force-enables
    # them (modedb `D` = digital + on). Without `D`, a TV sleep/wake HPD blip
    # looks like an unplug: weston disables HDMI-A-1, kiosk-shell never puts the
    # main surface back, and the next click SIGSEGVs the compositor (#821).
    # weston.ini uses mode=current to inherit the 1080p. Set on both ports so it
    # holds whichever one the cable is in. Validated on a 4K LG TV -> 1080p60.
    #
    # Audio real-time tuning: cpufreq.default_governor=performance pins the CPUs at
    # max clock (the default ondemand governor idles at 1.1 GHz mid-loop -> xruns).
    # threadirqs runs IRQ handlers as schedulable kernel threads so segno-rtirq can
    # raise the USB sound-card IRQ above the audio thread (PREEMPT_RT force-threads
    # them anyway, but keep it explicit so it also holds on a non-RT fallback).
    CMDLINE:append = " console=tty3 fbcon=map:9 audit=0 quiet loglevel=3 logo.nologo vt.global_cursor_default=0 consoleblank=0 video=HDMI-A-1:1920x1080@60D video=HDMI-A-2:1920x1080@60D splash plymouth.ignore-serial-consoles cpufreq.default_governor=performance threadirqs"
    # Kill the Raspberry Pi firmware's rainbow test square at boot (the plymouth
    # segno splash replaces it). `splash` above triggers plymouth despite `quiet`.
    RPI_EXTRA_CONFIG:append = "\ndisable_splash=1"

  rpi-wayland: |
    # Pi GPU + KMS so Mesa/Wayland/weston work. `pam` is required by systemd +
    # packagegroup-core-weston; keep x11 in so the image GTK3 stays a close ABI
    # match to our Ubuntu-built bundle (xwayland fallback also available).
    DISTRO_FEATURES:append = " wayland opengl systemd pam"

  segno: |
    # SEGNO_BOOT_DISK is set per board (kas-segno-rpi{4,5}.yml). The .wks.in is
    # expanded by bitbake's d.expand at image-recipe parse.

    # Install the prebuilt bundle recipe into the image. The recipe defaults
    # SEGNO_BUNDLE_DIR to deploy/yocto/prebuilt/bundle (staged by the build steps
    # in deploy/yocto/README.md); override here only to point elsewhere.
    IMAGE_INSTALL:append = " segno-bundle"

    # Product hostname (#496). Poky's base-files defaults the hostname to
    # ${MACHINE}, so without this the unit announces the board name
    # ("raspberrypi5") on every AP client list and SSH prompt. One name for
    # every board — a retired-board rebuild should carry the product name too.
    # NetworkManager sends it in DHCP by default (dhcp-send-hostname), so no NM
    # config is needed. base-files writes the same name into /etc/hosts; when
    # verifying a build, confirm on the built rootfs that "segno" self-resolves
    # (a hostname missing from /etc/hosts turns sudo-style lookups into
    # "unable to resolve host" warnings and slow boots).
    hostname:pn-base-files = "segno"

    # Kernel: use the 6.12 LTS instead of meta-raspberrypi's weak default (6.6, in
    # rpi-default-versions.inc). arm64 only selects ARCH_SUPPORTS_RT from ~6.12, so
    # CONFIG_PREEMPT_RT is selectable here (it is NOT on 6.6). The linux-raspberrypi
    # bbappend adds the rt.cfg fragment that turns it on.
    PREFERRED_VERSION_linux-raspberrypi = "6.12.%"
