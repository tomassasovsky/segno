# RAUC system config for the Segno appliance — Raspberry Pi firmware tryboot A/B.
# https://rauc.readthedocs.io/en/latest/reference.html#system-section
#
# @PLACEHOLDERS@ are substituted at do_install by rauc-conf.bbappend from the
# board's kas project, so the slot table, the WIC layout and the per-slot
# cmdline.txt are all generated from one pair of variables and cannot drift.
# A leftover @...@ in the installed file is a build error, not a runtime one.
[system]
# MUST byte-match RAUC_BUNDLE_COMPATIBLE in segno-update-bundle.bb — both come
# from SEGNO_RAUC_COMPATIBLE, so they cannot disagree. Per board on purpose: a
# Pi 4 bundle landing on a Pi 5 (or the reverse) would write the wrong kernel and
# device tree into the inactive slot, and RAUC refuses the mismatch instead.
compatible=@SEGNO_RAUC_COMPATIBLE@
bootloader=custom
data-directory=/boot/rauc

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
system-info=/usr/lib/rauc/rpi-firmware/system-info
bootloader-custom-backend=/usr/lib/rauc/rpi-firmware/bootloader-custom-backend

# Slot groups: each boot(FAT) slot is parent'ed to its rootfs slot so they update
# together (kernel in boot slot, its modules in the rootfs slot). Device numbers
# match segno-tryboot.wks.in: bootA=p2, bootB=p3, rootA=p5, rootB=p6.
[slot.firmware.0]
device=/dev/@SEGNO_BOOT_DISK@p2
type=vfat
parent=rootfs.0

[slot.firmware.1]
device=/dev/@SEGNO_BOOT_DISK@p3
type=vfat
parent=rootfs.1

[slot.rootfs.0]
device=/dev/@SEGNO_BOOT_DISK@p5
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/@SEGNO_BOOT_DISK@p6
type=ext4
bootname=B
