# RAUC keeps its data directory on /data (data-directory= in system.conf,
# #1397). RAUC creates the directory itself when it starts
# (g_mkdir_with_parents in r_context_configure_target, since RAUC 1.8), so if
# /data failed to mount it would create it in the rootfs and keep its status
# there. Requiring the mount keeps RAUC from starting instead.
#
# /boot needs no line here. rauc.service keeps its default dependencies, so it
# starts after local-fs.target, which boot.mount is part of. If /boot fails to
# mount, RAUC still starts and the backend reports the missing autoboot.txt.
[Unit]
RequiresMountsFor=/data/rauc
