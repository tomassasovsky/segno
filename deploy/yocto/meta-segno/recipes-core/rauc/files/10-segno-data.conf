# RAUC keeps its data directory on /data (data-directory= in system.conf), and
# its bootloader backend reads and writes /boot/autoboot.txt (#1397).
#
# /data is required. RAUC creates the data directory itself when it starts
# (g_mkdir_with_parents in r_context_configure_target, since RAUC 1.8), so
# without the mount it would create it in the rootfs and keep its status there.
#
# /boot is wanted and ordered, not required. If /boot fails to mount, RAUC
# still starts: `rauc status` works and the backend reports the missing
# autoboot.txt itself, instead of the daemon failing on a dependency.
# WantsMountsFor= needs systemd 256; the image ships 257.
[Unit]
RequiresMountsFor=/data/rauc
WantsMountsFor=/boot
