# RAUC keeps its data directory on /data (data-directory= in system.conf), and
# its bootloader backend reads and writes /boot/autoboot.txt. Without both
# mounts RAUC would write its status into the rootfs directory under an
# unmounted /data, or find no autoboot.txt (#1397).
[Unit]
RequiresMountsFor=/data/rauc /boot

[Service]
# RAUC saves central.raucs with g_key_file_save_to_file, which does not create
# the directory, so the first start after a flash would fail every status write.
ExecStartPre=/bin/mkdir -p /data/rauc
