# RAUC keeps its data directory on /data (data-directory= in system.conf), and
# its bootloader backend reads and writes /boot/autoboot.txt. RAUC creates the
# data directory itself when it starts (g_mkdir_with_parents in
# r_context_configure_target, since RAUC 1.8), so without the /data mount it
# would create it in the rootfs and keep its status there. Without /boot it
# would find no autoboot.txt (#1397).
[Unit]
RequiresMountsFor=/data/rauc /boot
