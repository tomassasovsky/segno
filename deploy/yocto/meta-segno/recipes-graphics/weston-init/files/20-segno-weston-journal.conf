# Capture weston's compositor log (#947, blocks #825).
#
# Stock weston.service already has StandardOutput=journal and
# StandardError=journal. That is not enough on this unit: journalctl -u weston
# holds only the two systemd start lines. weston 14 with Type=notify +
# TTYPath=/dev/tty7 does not send its own logger to those fds.
#
# --log= must be a path the weston user can write. /dev/stderr and /dev/fd/2
# both fail (Permission denied, exit 1, dark screen). /run/user/1000 is
# created for uid 1000 by segno-runtime.conf and is writable. Read it with
# `cat /run/user/1000/weston.log`, not journalctl.
#
# Do NOT add --logger-scopes=drm-backend here. On this unit that scope dumps
# the full scene graph every repaint and filled 4 MiB of /run in seconds.
# Enable it only for a short repro window, then take it off.
#
# systemd-notify.so stays: Type=notify will hang until timeout without it.
# The empty ExecStart= clears the stock line so this replaces it, not appends.
[Service]
ExecStart=
ExecStart=/usr/bin/weston --modules=systemd-notify.so --log=/run/user/1000/weston.log
