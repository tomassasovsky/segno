# Capture weston's compositor log in the journal (#947, blocks #825).
#
# Stock weston.service already has StandardOutput=journal and
# StandardError=journal. That is not enough on this unit: journalctl -u weston
# holds only the two systemd start lines, so every
# `not placing paint node ... on plane` reason is discarded.
#
# Two gaps, both in ExecStart (`weston --modules=systemd-notify.so`):
#   1. weston 14's default logger does not reliably reach those fds here
#      (Type=notify + TTYPath=/dev/tty7). --log=/dev/stderr pins it.
#   2. plane-assignment reasons live in the drm-backend log scope, which is
#      off unless subscribed. --logger-scopes=drm-backend is the weston 14
#      flag. `-d drm-backend` is not (`-d` is --debug and takes no argument).
#
# systemd-notify.so stays: Type=notify will hang until timeout without it.
# The empty ExecStart= clears the stock line so this replaces it, not appends.
[Service]
ExecStart=
ExecStart=/usr/bin/weston --modules=systemd-notify.so --log=/dev/stderr --logger-scopes=drm-backend
