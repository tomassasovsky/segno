[core]
# kiosk-shell: fullscreen, one app per output — the right model for an appliance.
shell=kiosk-shell.so
backend=drm-backend.so
# Blank nothing on an always-on stage unit.
idle-time=0

# --- Outputs: main UI + waveform on the two Pi 4 micro-HDMI ports ---------------
# Connector names come from DRM/KMS (weston logs them at startup; `weston-info`
# also lists them). Confirm on device; the two outputs extend left-to-right.
#
# mode=current (not preferred): the kernel `video=HDMI-A-*:1920x1080@60` cmdline
# (CMDLINE:append in kas-segno-rpi4.yml) forces the connector to 1080p at boot.
# `preferred` would re-pick the EDID preferred mode (4K on a 4K TV) and ignore the
# cmdline; `current` inherits the already-set 1080p CRTC mode. Validated on device
# (a 4K LG TV came up at 1920x1080@60). weston.ini `mode=1920x1080@60` also works
# but glitched the vc4 modeset (repaint-flush errors) — let the kernel own the mode.
# app-ids: kiosk-shell places a surface on the output whose `app-ids` list
# contains the surface's xdg app_id — a comma-separated, exact-token match
# (kiosk-shell.c kiosk_shell_output_has_app_id), applied when the surface's
# first real buffer is committed (desktop_surface_committed, weston 14). The
# GTK embedder gives the two windows distinct app-ids for exactly this:
# the main window keeps APPLICATION_ID and the waveform sub-window maps as
# "<APPLICATION_ID>.waveform" (linux/runner/my_application.cc — a scoped
# prgname swap around the sub-window's map). Without the pin both windows
# landed on the first output and the 7" stayed black (#689). A surface
# matching neither list falls back to the focused/default output, so a typo
# here reproduces the old behaviour rather than crashing.
[output]
name=HDMI-A-1
mode=current
# The main UI, on the TV.
app-ids=dev.aquiles.segno

[output]
name=HDMI-A-2
mode=current
# The waveform/readout second window, on the 7" touch panel.
app-ids=dev.aquiles.segno.waveform

# --- Touchscreen ---------------------------------------------------------------
# Weston already ships the calibrator (weston-touch-calibrator, installed by the
# base weston package) but keeps its protocol behind this switch — without
# `touchscreen_calibrator` the client starts and immediately fails to bind, so a
# panel that lands every tap off-target has no way to be corrected on the unit.
#
# `calibration_helper` is what makes a calibration outlive the session: weston
# applies the matrix live, then hands it to this helper to persist. With no
# helper the matrix is gone at the next replug. segno-touch-calibration-helper
# forwards it to segno-touch-ctl, which stores it on /data (so a RAUC A/B update
# does not wipe it) and regenerates the udev rule that feeds it back to libinput.
#
# The touchscreen -> output association is NOT set here: weston takes it from the
# WL_OUTPUT udev property, set in 97-segno-touch-output.rules.
[libinput]
touchscreen_calibrator=true
calibration_helper=/usr/bin/segno-touch-calibration-helper
