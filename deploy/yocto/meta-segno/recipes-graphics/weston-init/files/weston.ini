[core]
# kiosk-shell: fullscreen, one app per output — the right model for an appliance.
shell=kiosk-shell.so
backend=drm-backend.so
# Blank nothing on an always-on stage unit.
idle-time=0

# --- Outputs: main UI + waveform on the two Pi 4 micro-HDMI ports ---------------
# Connector names come from DRM/KMS (weston logs them at startup; `weston-info`
# also lists them). Confirm on device; the two outputs extend left-to-right.
#
# mode=current (not preferred): the kernel `video=HDMI-A-*:1920x1080@60D` cmdline
# (CMDLINE:append in kas-segno-common.yml) forces the connector to 1080p at boot
# and keeps it enabled across HPD blips (`D` = digital + force on; #821).
# `preferred` would re-pick the EDID preferred mode (4K on a 4K TV) and ignore the
# cmdline; `current` inherits the already-set 1080p CRTC mode. Validated on device
# (a 4K LG TV came up at 1920x1080@60). weston.ini `mode=1920x1080@60` also works
# but glitched the vc4 modeset (repaint-flush errors) — let the kernel own the mode.
# app-ids: kiosk-shell places a surface on the output whose `app-ids` list
# contains the surface's xdg app_id — a comma-separated, exact-token match
# (kiosk-shell.c kiosk_shell_output_has_app_id), applied when the surface's
# first real buffer is committed (desktop_surface_committed, weston 14). The
# GTK embedder gives the two windows distinct app-ids for exactly this:
# the main window keeps APPLICATION_ID and the waveform sub-window overrides
# its own toplevel to "<APPLICATION_ID>.waveform" as it maps
# (linux/runner/my_application.cc). Without the pin both windows
# landed on the first output and the 7" stayed black (#689). A surface
# matching neither list falls back to the focused/default output, so a typo
# here reproduces the old behaviour rather than crashing.
[output]
name=HDMI-A-1
# Pinned explicitly: under mode=current a 4K-preferring TV link-bounced on the
# bench (vc4 core clock cannot drive 4k@60; the sink kept renegotiating — picture
# flickered then dropped). An explicit 1080p60 held stable, and the historical
# "explicit modes glitch the vc4 modeset" warning did not reproduce on weston 14
# / kernel 6.12. The appliance's real panel is 1080p native, so this is also
# simply the right mode. Verified live 2026-08-16.
mode=1920x1080@60
# The main UI, on the TV.
app-ids=dev.aquiles.segno

[output]
name=HDMI-A-2
mode=current
# scale=3 gives the waveform window a 640x360 logical surface on this 1920x1080
# output. What that buys is narrower than it looks, and the distinction is the
# whole reason this comment exists — it decides when the line may be deleted.
#
# It does NOT resize the readout's own type. ConsoleReadoutView derives every
# dimension from its surface (console_readout_view.dart:62-64 scales the pen's
# 1920x1080 by the smaller of width/1920 and height/1080), and
# console_readout_view_test.dart pins that as a contract: the tempo figure is
# exactly full/3 on a 640x360 surface. A surface-proportional layout occupies the
# same fraction of a fullscreen surface at any compositor scale, so those labels
# are the same physical millimetres at scale=1 and at scale=3. Compositor scale
# cannot move them.
#
# What scale=3 actually holds up is the content that is NOT surface-proportional.
# Most of that is the waveform strip, but not all of it:
#   - the selected-track label (lib/visualizer/widgets/waveform_view.dart:73-82)
#     takes a fixed textTheme role (bodySmall) rather than a surface-derived
#     size, so it is 3x larger physically at scale=3.
#   - the playhead and baseline rects (waveform_view.dart:120, 150-155) are 1-4
#     logical px — hairlines on a 7" panel at scale=1.
#   - kAppTextOpticalOffset (lib/theme/text_metrics.dart:15, Offset(0,1)) is
#     applied by AppText as an UNSCALED Transform.translate
#     (lib/theme/app_text.dart:149-152) to every caps/digit string, so it lands
#     across the whole readout, not just the strip. It is listed for
#     completeness and it argues the other way: 1 logical px against
#     surface-proportional type is relatively 3x heavier at scale=3, so the
#     factor makes that nudge slightly worse, not better.
#
# So what would make 3 wrong is NOT a readout redesign; the readout is already
# scale-invariant. It is WaveformView being converted to the same proportional
# scheme the rest of the readout uses — an obvious future cleanup. The day that
# lands, nothing the factor was chosen for is left: the only non-proportional
# content still standing is the 1px optical nudge, which scale=3 aggravates
# rather than fixes. So it should then be deleted deliberately, on purpose,
# rather than found later by someone with no record of what it was for. A
# different or higher-density second panel also changes the answer, since it
# changes the physical size a logical pixel lands at.
#
# Signal path on this unit, because "1080p on both connectors" is not quite what
# happens. The cmdline asks for video=HDMI-A-1:1920x1080@60D and
# video=HDMI-A-2:1920x1080@60D, but the two land on different modes. Weston logs
# HDMI-A-1 as "1920x1080@60.0, preferred, current, 148.5 MHz" (progressive, and
# pinned explicitly above) and HDMI-A-2 as "1920x1080i@60.0, current, 74.2 MHz"
# — interlaced. This panel's own EDID-preferred mode is 1024x600 (make "Daewoo
# Electronics Company Ltd"), so the 1080-line signal is downscaled by the panel
# itself. That EDID reading is point-in-time, not something to re-derive on
# demand: the same connector has since been observed with a 0-byte
# /sys/class/drm/card0-HDMI-A-2/edid and only the no-EDID VESA fallback mode
# list (1024x768 / 800x600 / 848x480 / 640x480), while the CRTC still drove the
# 1080i mode set when the EDID was present. Re-read it before trusting it.
# The 640x360 logical figure is unaffected by any of that, but anyone
# chasing softness or flicker on the 7" should treat the interlaced link and the
# panel's internal scaler as first suspects rather than ruling out the mode.
#
# Provenance: scale=3 is older than this file's record of it, and it did not come
# out of the readout v2 typography work. console_readout_view.dart already
# documented "640x360 today at scale=3" when it landed in 9ba93ad9 (#696), one PR
# before readout v2 (924939cd, #702) — the factor was live throughout that work,
# not a product of it. What is new here is only writing it into the image, so a
# fresh flash comes up scaled instead of needing the same hand edit after every
# RAUC update.
scale=3
# The waveform/readout second window, on the 7" touch panel.
app-ids=dev.aquiles.segno.waveform

# --- Touchscreen ---------------------------------------------------------------
# Weston already ships the calibrator (weston-touch-calibrator, installed by the
# base weston package) but keeps its protocol behind this switch — without
# `touchscreen_calibrator` the client starts and immediately fails to bind, so a
# panel that lands every tap off-target has no way to be corrected on the unit.
#
# `calibration_helper` is what makes a calibration outlive the session: weston
# applies the matrix live, then hands it to this helper to persist. With no
# helper the matrix is gone at the next replug. segno-touch-calibration-helper
# forwards it to segno-touch-ctl, which stores it on /data (so a RAUC A/B update
# does not wipe it) and regenerates the udev rule that feeds it back to libinput.
#
# The touchscreen -> output association is NOT set here: weston takes it from the
# WL_OUTPUT udev property, set in 97-segno-touch-output.rules.
[libinput]
touchscreen_calibrator=true
calibration_helper=/usr/bin/segno-touch-calibration-helper
