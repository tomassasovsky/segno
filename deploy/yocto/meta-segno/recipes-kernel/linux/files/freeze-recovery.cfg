# Recover from a freeze and keep a record of it (#1437).
#
# On 2026-10-23 the console froze for 3.5 hours (journal stopped, ping still
# answered, SSH refused) until someone pulled the power, and nothing survived
# to say why. Three pieces turn that into a recorded reboot: the hardware
# watchdog (systemd's RuntimeWatchdogSec, see the systemd bbappend), a RAM
# region that survives a warm reset (pstore/ramoops, reserved by the ramoops
# overlay in kas-segno-rpi5.yml), and the options below.
#
# deploy/yocto/test/run_freeze_recovery_tests.sh holds each line in place. Check
# a built kernel with:
#   grep -E 'PSTORE|LOCKUP|HUNG_TASK|PANIC_TIMEOUT' .../linux-raspberrypi5-standard-build/.config

# pstore with the RAM backend. bcm2712_defconfig already builds these in; they
# are pinned here because a defconfig bump that dropped them would leave the
# overlay reserving memory nobody writes, and nothing would say so.
# PSTORE_CONSOLE keeps a copy of the kernel console in the region, which is the
# only record a hang that never panics can leave.
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y
CONFIG_PSTORE_CONSOLE=y

# Reboot 10 s after a panic instead of halting forever (the defconfig's 0).
# The systemd watchdog would also reset a halted kernel, but only once PID 1
# has opened /dev/watchdog. A panic before that (a tryboot slot whose rootfs
# does not mount, for one) would otherwise hang the console with no way back.
# A panic reset does not carry the one-shot tryboot flag, so the firmware boots
# the committed slot: the bad slot falls back by itself. The 10 s leave the
# panic's dmesg record time to reach the ramoops region first.
CONFIG_PANIC_TIMEOUT=10

# Soft and hard lockups: detect them and panic. On this kernel both are safe
# against the SCHED_FIFO audio threads:
#
# - The soft-lockup check runs as a stop-machine work item on each CPU. The
#   stop class preempts every SCHED_FIFO thread, so a busy audio thread
#   cannot delay it. It only fires when a CPU spends 20 s (2 x watchdog_thresh)
#   with preemption off. PREEMPT_RT makes nearly all kernel code preemptible,
#   so only a real bug (a stuck raw spinlock or IRQs-off loop) does that.
# - The hard-lockup check is the "buddy" detector: each CPU checks that the
#   next CPU's watchdog hrtimer still fires. Perf-NMI hard-lockup detection
#   needs arm64 pseudo-NMI, which needs GICv3; the Pi 5 has a GIC-400 (v2), so
#   buddy is the only option, and Kconfig picks it on its own. Its hrtimer is
#   a HARD hrtimer, so it still expires in IRQ context under PREEMPT_RT.
#   It fires when a CPU has had interrupts off for 10 s.
#
# A CPU stuck like that has stopped the audio on it already, so a panic loses
# nothing that still works and gains a dmesg record. The cost while healthy is
# one hrtimer and one stopper wake-up per CPU every 4 s, a few microseconds
# each, which is noise next to the audio period.
CONFIG_SOFTLOCKUP_DETECTOR=y
CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=y
CONFIG_HARDLOCKUP_DETECTOR=y
CONFIG_BOOTPARAM_HARDLOCKUP_PANIC=y

# Hung tasks: detect and log, never panic.
#
# A task in uninterruptible sleep for 120 s is not proof the console is broken.
# Writing a take to a slow or failing USB stick is the case that happens here:
# the export's sync, or the umount behind an eject, can wait minutes on the
# stick, while audio keeps running. A panic there would reboot the console in
# the middle of a set. So the detector stays as the defconfig has it (warn at
# 120 s, KERN_ERR), and the cmdline's loglevel=4 lets that warning reach the
# pstore console copy as well as the journal. A hang that does stop PID 1 is
# the hardware watchdog's job.
CONFIG_DETECT_HUNG_TASK=y
CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=120
# CONFIG_BOOTPARAM_HUNG_TASK_PANIC is not set
