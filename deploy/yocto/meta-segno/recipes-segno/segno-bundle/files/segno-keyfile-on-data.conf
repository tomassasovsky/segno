# Saved networks on /data (#432, #1843).
#
# The one NetworkManager setting this image adds to Raspberry Pi OS's. Pi OS
# keeps keyfiles in /etc/NetworkManager/system-connections; here /etc is on
# the A/B root filesystem, which every OS update replaces, so a profile saved
# there would be gone after the next update. /data is never touched by an
# update. segno-nm-persist.service creates the directory before
# NetworkManager starts.
#
# Keyfiles do not depend on the Wi-Fi backend: the profiles the iwd images
# saved here load and join unchanged on wpa_supplicant.
[keyfile]
path=/data/NetworkManager/system-connections
