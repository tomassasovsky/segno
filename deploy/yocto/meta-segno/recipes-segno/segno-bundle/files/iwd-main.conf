# Segno appliance iwd configuration (#824).
#
# NetworkManager owns the radio (wifi.backend=iwd, wifi.iwd.autoconnect=no in
# 99-segno-wifi.conf) — but that only binds once NM manages the device. In the
# early-boot window iwd is on its own, and left to its defaults it scans and
# autoconnects off its own store. NM then kicks it off and activates into the
# teardown, which can fail as a bogus 'no-secrets' — the #824 boot race.
#
# Periodic scanning off: iwd never goes looking on its own. NM requests scans
# explicitly over D-Bus, so the Network tab's scan/join flows are unaffected —
# verified on the bench: `nmcli device wifi rescan` still returns the full
# neighbourhood with this set.
[Scan]
DisablePeriodicScan=true
