# segno.service drop-in for the ivi-homescreen image (#1318): no compositor.
# ivi-homescreen opens the vc4 card and takes the DRM master itself, which
# plymouth holds for the boot splash until it quits — the same wait weston has
# on the GTK image (plymouth-segno-theme's weston drop-in).
#
# It also opens the touchscreen through libinput itself, so the calibration
# rule segno-touch-persist restores from /data has to exist first — the
# ordering that unit's own Before=weston.service gives the GTK image.
[Unit]
After=plymouth-quit-wait.service segno-touch-persist.service

[Service]
# A stop takes about 0.35 s on this image. One stop in 61 on the bench hung
# until systemd's 90 s SIGKILL and left nothing to debug (#1318). Give up after
# 15 s instead (still above the ~10 s a segno-prof sample could hold a stop
# before it attached per sample, #1328), and abort rather than kill: SIGABRT
# leaves a core dump with every thread's stack in coredumpctl.
TimeoutStopSec=15s
TimeoutStopFailureMode=abort
