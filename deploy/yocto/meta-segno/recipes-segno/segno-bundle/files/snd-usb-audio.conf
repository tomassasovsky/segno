# Scarlett Gen 3 on Pi 5 + PREEMPT_RT 6.18: the driver's default lowlatency
# URB path produces robotic monitor audio at 96 kHz / 64 frames (walnascar
# 6.12 was fine). lowlatency=0 keeps class-compliant implicit-feedback sync
# but uses the non-lowlatency completion path — restores clean 96 kHz duplex
# on this appliance. Re-evaluate if upstream snd-usb-audio changes the
# lowlatency URB logic for Focusrite implicit-fb devices.
options snd-usb-audio lowlatency=0
