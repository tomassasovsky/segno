# ivi-homescreen configuration for the Segno console (#1318). Installed as
# /etc/segno/homescreen.toml; segno-kiosk-launch passes it with --config.
#
# Two views of the same bundle, one Flutter engine each, in one process, drawn
# straight to the two HDMI outputs over DRM/KMS with no compositor. Each engine
# learns its role from --segno-screen= (lib/visualizer/screen_link.dart), and
# the two talk through the Dart VM they share, not through the embedder.
#
# Keys are ivi-homescreen v3's (docs/config-examples/reference.toml at the
# commit ivi-homescreen_git.bb pins).

[global]
# Nothing on the console is driven by a pointer.
disable_cursor = true

# --- Main UI: the 15.6" 1080p touch panel on HDMI-A-2 --------------------------
# The console's cabling: the 15.6" is on the Pi 5's HDMI1 port (HDMI-A-2) and
# the 7" on HDMI0 (HDMI-A-1), confirmed on the assembled console 2026-10-17.
# The app reads both connectors from this file (brightness_client), so the
# roles follow it.
[[view]]
bundle = '/opt/segno'
fullscreen = true

  [view.args]
  dart = ['--segno-screen=main']
  # --impeller-use-sdfs is left out on purpose, on both views (#1777).
  # Flutter's GTK, macOS and Windows embedders always pass it; the embedder
  # API ivi-homescreen uses leaves it off. Signed-distance-field shapes kept
  # the Pi 5's V3D 63% busy on the stage against 27%, dropped frames, and
  # took the readout's raster time from 5.9 to 10.4 ms (p50); paths stay
  # aliased without the 4x MSAA framebuffer (IVI_DRM_MSAA_SAMPLES, #1687), so
  # it is needed either way. Never write --impeller-use-sdfs=false: the
  # engine only checks whether the switch is present, so that turns SDF on.
  engine = ['--enable-impeller=true']

  [view.backend]
  type = 'drm-kms-egl'

    [view.backend.drm]
    # No `device`: ivi-homescreen picks the card with a connected connector,
    # which on the Pi 5 is the vc4 display card, never the render-only v3d one.
    # Both views must name the device identically (here: not at all) or they
    # open two DRM masters on one card.
    #
    # The service runs as root on a kiosk with no logind session: take the DRM
    # master and the input devices directly instead of through a seat.
    no_seat = true
    # No `mode`: the first mode the connector lists, its native 1080p. The
    # connector reads an empty EDID on the console, so no mode is preferred
    # and 1920x1080 comes first only because the kernel command line forces it
    # (video=HDMI-A-2:1920x1080@60D, kas-segno-common.yml) and it is larger
    # than the kernel's 1024x768 fallback. A pinned mode the connector does
    # not list stops the whole process at start.

  [view.output]
  drm_connector = 'HDMI-A-2'
  # Its touch needs no `touch_device`: touch that matches no view's lands on
  # the first view, this one.

# --- Readout: the 7" 1024x600 touch panel on HDMI-A-1 --------------------------
[[view]]
bundle = '/opt/segno'
fullscreen = true
# The readout's physical size as the design and the earlier GTK image had it,
# at the panel's native mode. That image drew a 640x360 logical surface at
# scale=3 into a 1920x1080i signal the panel scaled down to its 1024x600:
# about 1.6 panel pixels per logical pixel (1024/640). Here the panel is
# driven natively, so the same ratio gives the same size (640x375 logical)
# without the panel's scaler or the interlaced link, the first suspects for
# the softness and flicker it had.
# A float: an integer is ignored. Needs the pixel-ratio patch
# ivi-homescreen_git.bb carries; upstream ignores it on DRM.
pixel_ratio = 1.6

  [view.args]
  dart = ['--segno-screen=readout']
  # No --impeller-use-sdfs: see the main view.
  engine = ['--enable-impeller=true']

  [view.backend]
  type = 'drm-kms-egl'

    [view.backend.drm]
    no_seat = true
    # The panel's native 1024x600, which pixel_ratio is set for (#1591). The
    # connector reads an empty EDID on the console, so it marks no mode
    # preferred and lists the kernel's fallback 1024x768 first: unpinned, the
    # readout ran at 1024x768 and the panel squeezed it to 1024x600. The pin
    # is safe because the kernel command line forces this connector on at
    # 1024x600@60 (video=HDMI-A-1:1024x600@60D, kas-segno-common.yml), which
    # puts the mode in its list with or without a panel or an EDID. A pinned
    # mode the connector does not list stops the whole process at start, so
    # the two must change together.
    mode = '1024x600@60'

  [view.output]
  drm_connector = 'HDMI-A-1'
  # The 7"'s controller, a wch.cn "USB2IIC_CTP_CONTROL" (USB 1a86:e5e3,
  # verified on the bench unit): a substring of its libinput device name.
  # Touch that matches no view's touch_device goes to the first view, the
  # main screen, so the main panel's own controller (a SiS HID touch
  # controller on the bench unit) and any replacement panel need no entry.
  touch_device = 'USB2IIC_CTP_CONTROL'
