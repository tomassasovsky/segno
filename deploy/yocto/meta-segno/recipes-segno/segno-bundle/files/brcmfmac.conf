# CYW43455 (Pi 4 / Pi 5): the brcmfmac options Raspberry Pi OS ships in
# /lib/modprobe.d/rpi-brcmfmac.conf (RPi-Distro/firmware-nonfree 2788cb5,
# firmware-brcm80211 on Bookworm and Trixie), word for word.
#
# roamoff=1 turns off the firmware's internal roaming. Without it the console
# associated with MyHouseWTF_es_2.4G and then never received EAPOL M1, so the
# 4-way handshake never completed. Pi OS sets it because the onboard WiFi
# was seen to crash, apparently from internal roaming (2788cb5).
#
# feature_disable=0x282000 masks three firmware features: FWSUP (bit 13, the
# firmware's own supplicant), SAE (bit 19, SAE offload) and DUMP_OBSS (bit
# 21). Pi OS added it with roamoff=1 for the same stability reason. The
# 7.45.265 firmware the image ships advertises neither FWSUP nor SAE, so on
# the console only DUMP_OBSS changes: debugfs ieee80211/phy*/features reads
# 00440896 with the mask and 00640896 without it. This follows Pi OS; it was
# not shown to fix the status 16 join failure in #1816.
options brcmfmac roamoff=1 feature_disable=0x282000
