# Keep every set of kernel crash records, not only the latest (#1437).
# systemd-pstore copies ramoops records to the top of /var/lib/systemd/pstore
# under their kernel names, so the next crash would replace the last one.
# segno-pstore-keep moves each set into its own directory and prunes old sets
# by count (crash sets and console-only sets separately). The unit only runs
# when /sys/fs/pstore holds something (ConditionDirectoryNotEmpty upstream).
[Service]
ExecStartPost=/usr/bin/segno-pstore-keep
