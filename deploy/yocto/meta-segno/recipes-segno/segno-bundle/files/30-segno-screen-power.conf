[Unit]
BindsTo=segno-screen-power.service
After=segno-screen-power.service

[Service]
# Power before Weston probes HDMI/touch. On shutdown/restart, drive low and
# finish the discharge wait BEFORE systemd terminates Weston and its HDMI output.
# Segno orders itself After=weston, so its save/goodbye/stop completes first.
ExecStartPre=+/usr/bin/segno-screen-power on
ExecStop=+/usr/bin/segno-screen-power off
# Also runs when startup fails or Weston exits before ExecStop can be invoked.
ExecStopPost=+/usr/bin/segno-screen-power off
# Ten seconds to reclaim a failed owner plus five seconds to discharge.
TimeoutStopSec=20
