# The app draws both HDMI outputs itself (ivi-homescreen, no compositor), so it
# is the unit the screen supply follows. Started by the app; no independent boot
# enable or automatic re-enable.
[Unit]
BindsTo=segno-screen-power.service
After=segno-screen-power.service

[Service]
# Power the panels and let them come up before the app opens the outputs: a
# panel powered after the app's first frame keeps a stale image (#821). On
# stop/restart, drive low and finish the discharge wait BEFORE systemd
# terminates the app and with it the HDMI signal.
ExecStartPre=+/usr/bin/segno-screen-power on
ExecStop=+/usr/bin/segno-screen-power off
# Also runs when startup fails or the app exits before ExecStop can be invoked.
ExecStopPost=+/usr/bin/segno-screen-power off
# Ten seconds to reclaim a failed owner plus five seconds to discharge, above
# the app's own 15 s stop budget.
TimeoutStopSec=20
