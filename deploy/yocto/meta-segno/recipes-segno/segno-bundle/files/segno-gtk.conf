# segno.service drop-in for the GTK image: the app is a Wayland client of
# weston. weston-init starts weston (kiosk-shell + the HDMI outputs from
# weston.ini); the app connects to its socket.
#
# NOTE (blocked-verify): the Wayland socket name (wayland-0/wayland-1), the
# XDG_RUNTIME_DIR, and the user weston runs as depend on the weston-init setup on
# the image — confirm on device and adjust WAYLAND_DISPLAY / XDG_RUNTIME_DIR / User.
[Unit]
After=weston.service
Requires=weston.service

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=WAYLAND_DISPLAY=wayland-1
# RestartSec=3 (in segno.service) is also the back-off while Weston recovers
# (#970).
