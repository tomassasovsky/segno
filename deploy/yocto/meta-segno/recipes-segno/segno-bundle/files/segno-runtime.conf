# Removable USB storage (#1177): the state the app watches (one JSON per
# volume), its eject-request queue, and the mount-point root. All on tmpfs: a
# volume record must not outlive the boot it was written in.
d /run/segno 0755 root root -
d /run/segno/usb 0755 root root -
d /run/segno/usb/volumes 0755 root root -
d /run/segno/usb/requests 0755 root root -
d /run/media 0755 root root -
d /run/media/segno 0755 root root -
