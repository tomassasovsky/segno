# weston runs as User=weston (uid 1000) but this minimal image has no logind
# login session for it, so /run/user/1000 is never created -> weston can't make
# its Wayland socket and crash-loops (status=6/ABRT). Create the XDG runtime dir
# declaratively at boot. Validated on device: with this present weston comes up
# 0-restarts and segno connects to /run/user/1000/wayland-1.
d /run/user/1000 0700 weston weston -

# Removable USB storage (#1177): the state the app watches (one JSON per
# volume), its eject-request queue, and the mount-point root. All on tmpfs: a
# volume record must not outlive the boot it was written in.
d /run/segno 0755 root root -
d /run/segno/usb 0755 root root -
d /run/segno/usb/volumes 0755 root root -
d /run/segno/usb/requests 0755 root root -
d /run/media 0755 root root -
d /run/media/segno 0755 root root -
