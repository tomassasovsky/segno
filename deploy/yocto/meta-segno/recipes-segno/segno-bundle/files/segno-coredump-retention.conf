# Stop systemd deleting the crash evidence after a fortnight (#438).
#
# systemd's own tmpfiles.d/systemd.conf ships
#
#   d /var/lib/systemd/coredump 0755 root root 2w
#
# so systemd-tmpfiles-clean.timer removes every core older than two weeks,
# whatever coredump.conf says. On a floor console played a few times a month
# that is the same mistake a MaxRetentionSec in the journal would be: wall-clock
# age becomes the binding constraint instead of size, and the fault is vacuumed
# before anyone sits down to look at it. Size is the bound that belongs here —
# coredump.conf.d/10-segno.conf sets MaxUse=32G and KeepFree=16G, which scale
# with the disk rather than with how often the instrument gets played.
#
# `-` in the age field means never clean. It overrides systemd's line because
# tmpfiles applies, for any one path, the entry from the lexicographically
# earliest FILENAME across all of its directories, and 10-segno-coredump.conf
# sorts before systemd.conf. (systemd logs the losing entry; it does not fail.)
d /var/lib/systemd/coredump 0755 root root -
