# Coredump policy for the appliance (#438).
#
# `external` writes the core to a file rather than into the journal: a Flutter
# engine core is tens of megabytes and would blow through the journal's own caps
# in one crash, taking the log evidence with it. The backtrace still lands in
# the journal either way — that is systemd-coredump's own doing, and with
# elfutils built in (see the systemd bbappend) it carries symbol names.
#
# The caps assume this is a recording appliance: keep enough to diagnose a
# crash, never enough to cost a performance its disk.
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=1G
ExternalSizeMax=1G
MaxUse=1G
KeepFree=2G
