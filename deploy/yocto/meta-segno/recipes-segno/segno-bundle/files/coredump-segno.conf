# Coredump policy for the appliance (#438).
#
# `external` writes the core to a file rather than into the journal: an engine
# core is orders of magnitude larger than the journal's own caps, so one crash
# would rotate the log evidence out to make room for itself. The backtrace
# still lands in the journal either way — that is systemd-coredump's own doing,
# and with elfutils built in (see the systemd bbappend) it carries symbol
# names.
#
# THE SIZE CAPS ARE THE REASON THIS FILE EXISTS. A core larger than
# ProcessSizeMax may still be stored, but no stack trace is generated for it —
# which is precisely the unreadable blob #438 asked us to stop producing, and
# it would happen on the biggest crashes, the ones most worth reading.
# segno.service hosts a Flutter GTK embedder plus the engine, holds loop audio
# in RAM, and runs with LimitMEMLOCK=infinity, so there is no honest number for
# how big it gets. 8G is honest for a different reason: it is the board's
# entire RAM, so no process here can reach it.
#
# Explicit rather than left to the default, because the default is not one
# number: systemd defaults ProcessSizeMax and ExternalSizeMax to 32G on 64-bit
# and 1G on 32-bit. 1G is what this file used to say, and on this image it
# would have suppressed the trace on any crash above a gigabyte. A value tied
# to the board's RAM says what we mean whichever way the image is built.
#
# The three caps measure three different things, which is why they are not the
# same number. ProcessSizeMax is the UNCOMPRESSED core — the process itself.
# ExternalSizeMax is the file as actually written, compressed, and Compress=yes
# (systemd's default, pinned because this reasoning leans on it) makes that a
# fraction of the process, since a core is mostly zero and untouched pages. So
# 8G of ExternalSizeMax can never bind before 8G of ProcessSizeMax does.
# MaxUse is disk occupancy across all cores kept, so it has to sit well above
# ProcessSizeMax or the vacuum would delete each core as it landed: 32G is four
# full-RAM cores even if compression achieved nothing at all.
#
# Neither is left to its default either, and they move in opposite directions
# from it. systemd defaults MaxUse to 10% of the filesystem and KeepFree to
# 15% — about 90G and 134G of this 897 GB partition. 32G is tighter than 90G
# because /data is for performance captures, not for cores. KeepFree=16G is
# deliberately looser than 134G: a 134 GB free-space floor on a disk meant to
# be filled with takes would vacuum crash evidence while there was still room
# for hundreds of gigabytes of it. 16G is where the disk really is nearly full,
# and that is the point at which the take wins and the evidence goes.
#
# Size is the only bound here on purpose. systemd's own tmpfiles line would
# also delete every core after two weeks, which on an instrument played a few
# times a month is a deletion nobody asked for — see
# tmpfiles.d/10-segno-coredump.conf, which turns that off, and the journald
# drop-in, which drops the MaxRetentionSec that was the same mistake.
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=8G
ExternalSizeMax=8G
MaxUse=32G
KeepFree=16G
