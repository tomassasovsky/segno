# Coredump policy for the appliance (#438).
#
# `external` writes the core to a file rather than into the journal: an engine
# core is orders of magnitude larger than the journal's own caps, so one crash
# would rotate the log evidence out to make room for itself. The backtrace
# still lands in the journal either way — that is systemd-coredump's own doing,
# and with elfutils built in (see the systemd bbappend) it carries symbol
# names.
#
# EVERY NUMBER HERE MUST HOLD ON A 2 GiB FILESYSTEM. The .wic seeds /data at
# 2 GiB (wic/segno-tryboot.wks) and segno-data-grow.service, which expands it
# to fill the card, is WantedBy=multi-user.target — these mounts and journald's
# flush are live long before it runs. An earlier revision sized MaxUse and
# KeepFree against the grown 897 GB partition, and on the seed that KeepFree
# was UNSATISFIABLE (free space on a 2 GiB fs can never reach 16G), which makes
# systemd-coredump vacuum the store to empty before every dump: the cap meant
# to protect the takes deleted the crash evidence instead. So the caps are
# static, small, and derived from the seed; they are merely conservative on the
# grown disk and can be raised if someone later orders the grow before the
# flush (a call nobody should make casually — segno-data-grow runs parted).
#
# The budget on the ~1.9 GiB usable seed: journald takes at most 100M
# (journald.conf.d/10-segno.conf), cores at most 500M here, and KeepFree=500M
# is comfortably below the ~1.3 GiB that remains free with both stores full —
# so every cap is reachable, and when real takes fill the disk the vacuum
# gives the space back to the take, evidence second. That is the intended
# order on an instrument.
#
# The three size knobs measure three different things:
#
#   ProcessSizeMax=8G   — the UNCOMPRESSED core systemd-coredump will process
#                         at all. Over it the backtrace is SKIPPED, which is
#                         precisely the unreadable outcome #438 exists to
#                         prevent, and it would hit the biggest crashes — the
#                         ones most worth reading. segno.service hosts Flutter
#                         + Mesa + the engine with LimitMEMLOCK=infinity, so
#                         there is no honest smaller bound; 8G is the board's
#                         entire RAM, unreachable by construction. This knob
#                         costs no disk, so the 2 GiB floor does not shrink it.
#   ExternalSizeMax=500M — the file as actually written, COMPRESSED
#                         (Compress=yes, systemd's default, pinned because
#                         this reasoning leans on it). A core is mostly zero
#                         and untouched pages, so a multi-GB kiosk core
#                         usually lands well under this — but not always, and
#                         the tradeoff is stated rather than implied: THE
#                         BACKTRACE IS ALWAYS KEPT; a core over 500M
#                         compressed is stored TRUNCATED. On a 2 GiB /data
#                         there is no honest way to promise a whole 8 GB core.
#   MaxUse=500M          — disk occupancy across all kept cores, equal to
#                         ExternalSizeMax on purpose: the store holds one
#                         full-size core, and the next crash vacuums the
#                         previous one rather than failing to land. Sizing
#                         MaxUse below ExternalSizeMax would make the larger
#                         file cap a dead letter.
#
# KeepFree=500M: systemd's default is 15% of the fs — 134G on the grown disk,
# which would vacuum crash evidence while there was still room for hundreds of
# gigabytes of takes, and (see above) an absolute value near that is
# unsatisfiable on the seed. 500M is where the seed disk really is nearly
# full, and on the grown disk it simply never binds before MaxUse does.
#
# Size is the only bound here on purpose. systemd's own tmpfiles line would
# also delete every core after two weeks, which on an instrument played a few
# times a month is a deletion nobody asked for — see
# tmpfiles.d/10-segno-coredump.conf, which turns that off, and the journald
# drop-in, which drops the MaxRetentionSec that was the same mistake.
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=8G
ExternalSizeMax=500M
MaxUse=500M
KeepFree=500M
