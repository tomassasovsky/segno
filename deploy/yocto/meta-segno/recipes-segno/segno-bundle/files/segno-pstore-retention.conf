# Keep the kernel crash records (#1437).
#
# systemd's tmpfiles.d/systemd-pstore.conf ships
#
#   d /var/lib/systemd/pstore 0755 root root 14d
#
# which deletes every record after two weeks. That is the same mistake the
# coredump retention override (10-segno-coredump.conf) undoes: a console played
# a few times a month would lose the record of a crash before anyone looked.
#
# The archive stays small without pruning. A dmesg record is written only by a
# panic or an oops, and the console copy holds only kernel messages at error
# level or worse, capped at the ramoops console size per boot. segno-pstore-keep
# files each set under its own directory.
#
# `-` means never clean. 10-segno-pstore.conf sorts before systemd-pstore.conf,
# and tmpfiles takes the entry for a path from the earliest file name.
d /var/lib/systemd/pstore 0755 root root -
