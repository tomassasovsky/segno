# Journal storage on /data (#438).
#
# Without this the journal is RAM-only and keeps exactly one boot, so every
# crash and every unexplained reboot arrives with its cause already deleted.
# That is not hypothetical: an unexplained shutdown during the #804
# investigation is permanently unknowable because of it.
#
# `auto`, not `persistent`. `persistent` makes journald CREATE /var/log/journal
# and write to it wherever that path happens to live — and on this image
# /var/log is a symlink into the /var/volatile tmpfs, so if the bind mount
# under it never landed, `persistent` builds a healthy-looking journal in RAM,
# consuming memory and reporting success. `auto` only writes persistently when
# /var/log/journal already exists, and the only unit that brings that
# directory into existence is var-volatile-log-journal.mount binding it to
# /data — so "persistent" and "actually on /data" become the same condition,
# and a failed mount visibly leaves the journal in runtime storage instead of
# impersonating a fix. (One sliver survives: systemd creates a mount unit's
# Where= directory just before calling mount(2), so a mount that got that far
# and then failed leaves an empty tmpfs directory `auto` would accept.
# segno-log-check.service compares the backing DEVICE and stays the loud
# backstop for exactly that case.)
#
# THE CAPS ARE SIZED FOR THE 2 GiB SEED, NOT THE GROWN PARTITION. The .wic
# ships /data at 2 GiB (files/wic/segno-tryboot.wks.in) and segno-data-grow —
# the oneshot that expands it to fill the card — is WantedBy=multi-user.target,
# long after this journal is live and flushed. So on a fresh flash every number
# here must already be safe on a 2 GiB filesystem (~1.9 GiB usable), and merely
# conservative on the grown one. Deliberately static and small rather than
# ordering the grow earlier: segno-data-grow runs parted on the disk the rootfs
# is mounted from, and moving THAT into the early-boot window to make room for
# bigger log caps is a risk with no payoff at these sizes.
#
#   SystemMaxUse=100M   — a bench boot logged 6521 entries (single-digit MB),
#                         so this is still dozens of boots; 5% of the seed fs.
#   SystemKeepFree=500M — satisfiable on the seed (fresh fs has ~1.9 GiB free;
#                         the old 1G left almost nothing) and it encodes the
#                         same rule at both sizes: when the disk fills with
#                         takes, the take wins and the journal stops growing.
#   SystemMaxFileSize=20M — rotation granularity: vacuuming frees 20M steps,
#                         not the whole journal at once.
#
# NO MaxRetentionSec. There was a 4week here and it was the wrong bound. A
# floor console powered up for a few sessions a month will not come near 100 MB
# in four weeks, so wall-clock age would have been the BINDING constraint, and
# a fault looked into five weeks later would already have been vacuumed — the
# exact loss this file exists to prevent, with the fix in place. Size is the
# honest bound, and it stays dozens of boots whether they happen this week or
# over a year. (tmpfiles.d/10-segno-coredump.conf makes the same call for the
# cores.)
#
# NOT YET SOAKED: this puts journald's writes on the same ext4 + jbd2 journal
# as the audio recorder's takes. The >=2 h audio soak in docs/RUNNING_ON_RPI.md
# is owed on an image built from this branch before the change is called
# verified — autonomy:blocked-verify on the PR carries that gate.
[Journal]
Storage=auto
SystemMaxUse=100M
SystemKeepFree=500M
SystemMaxFileSize=20M
