# Journal storage on /data (#438).
#
# Without this the journal is RAM-only and keeps exactly one boot, so every
# crash and every unexplained reboot arrives with its cause already deleted.
# That is not hypothetical: an unexplained shutdown during the #804
# investigation is permanently unknowable because of it.
#
# `persistent` rather than `auto`: `auto` only writes to disk if
# /var/log/journal already exists, which makes the behaviour depend on directory
# creation order at boot. `persistent` makes journald create it and say so.
#
# It also means journald will happily create that directory on the TMPFS under
# /var/log if the bind mount never landed, and report a healthy journal while
# keeping none of it. segno-log-check.service is what turns that back into a
# loud failure — it is not optional decoration around this file.
#
# NO MaxRetentionSec. There was a 4week here and it was the wrong bound. A
# floor console powered up for a few sessions a month will not come near 200 MB
# in four weeks, so wall-clock age would have been the BINDING constraint, and
# a fault looked into five weeks later would already have been vacuumed — the
# exact loss this file exists to prevent, with the fix in place. Size is the
# honest bound: a bench boot logged 6521 entries, so 200M is dozens of boots,
# and it stays dozens of boots whether they happen this week or over a year.
#
# The caps are the point of the rest. The console is an instrument, not a
# server, and /data is where performance captures live — a boot loop writing
# unbounded journal must never be able to crowd out a take.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
SystemMaxFileSize=20M
