# kas project: the Segno appliance image for the raspberrypi4-64, booting from
# the SD card. This is the board the Tier 3a spike (#284) was validated on and
# where A/B tryboot updates were first proven end to end (2026-07-25).
#
#   ./kas-container build deploy/yocto/kas-segno-rpi4.yml
#
# The Pi 5 / NVMe variant is kas-segno-rpi5.yml. Everything the two boards share
# lives in kas-segno-common.yml — put changes there unless they are genuinely
# board-specific. See README.md for the full flow.
header:
  version: 14
  includes:
    - kas-segno-common.yml

machine: raspberrypi4-64

local_conf_header:
  segno-board: |
    # The block device the image is flashed to and boots from. Threaded through
    # the WIC layout, the RAUC slot table and the per-slot cmdline.txt so the
    # three can never disagree — see meta-segno/wic/segno-tryboot.wks.in.
    SEGNO_BOOT_DISK = "mmcblk0"

    # RAUC compatible string. Deliberately per-board: a Pi 5 bundle installing
    # itself onto a Pi 4 would brick the slot it landed in, so the two products
    # carry different strings and RAUC refuses the mismatch.
    SEGNO_RAUC_COMPATIBLE = "segno-raspberrypi4"
