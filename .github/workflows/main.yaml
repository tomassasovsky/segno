name: segno

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      run_bloc_lint: true
      # format_directories/analyze_directories default to "lib test", which
      # only covers the root app. Glob in every package's lib/ + test/ too, so
      # `dart format --set-exit-if-changed` and `flutter analyze` actually gate
      # the 13 packages/* (daw_export, segno_engine, etc.) instead of silently
      # skipping them. The glob is spliced into a plain bash step by the
      # reusable workflow, so it self-expands as packages are added/removed —
      # no need to edit this list when packages/* changes.
      format_directories: "lib test packages/*/lib packages/*/test"
      analyze_directories: "lib test packages/*/lib packages/*/test"
      # Keep the 90% gate for real logic, but exclude platform / entrypoint glue
      # that can't be meaningfully unit-tested: the custom window chrome
      # (window_manager), the desktop_multi_window output-waveform sub-window,
      # and the app bootstrap/entrypoint. Coverage on the remainder stays ~91%.
      min_coverage: 90
      coverage_excludes: "**/window_chrome.dart **/waveform_window*.dart **/run_segno.dart **/bootstrap.dart **/session_directory.dart **/system_appliance_env.dart"

  # daw_export is a pure Dart package (no Flutter dependency, plain `test`
  # instead of `flutter_test`) so it can't ride the root flutter_package.yml
  # job above — that job only runs the root app's own test/ dir. It gets its
  # own dart_package.yml job instead. No bloc usage here, so bloc lint is off.
  daw-export:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1
    with:
      working_directory: packages/daw_export
      run_bloc_lint: false
      min_coverage: 100

  # Per-package test + coverage gates for the five domain packages (FX v3
  # part 3a [VGV-critical]): the root `build` job only runs the root app's own
  # test/ dir, so until these jobs existed the packages' suites never ran in
  # CI at all. One job per package (same flutter_version as `build` so the
  # matrix can't drift; no bloc usage in the repository layer, so bloc lint is
  # off). Coverage floors are pinned AT the value measured when the job was
  # added — deliberately not rounded up (a blind 100 blocks every later part)
  # and never silently lowered (raise-only from here). Native-lib-dependent
  # tests (the fingerprint agreement suite) are fuzz-tagged and self-skip
  # here; the `fuzz` job below runs them against the real engine.
  looper-repository:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      working_directory: packages/looper_repository
      run_bloc_lint: false
      min_coverage: 95
  session-repository:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      working_directory: packages/session_repository
      run_bloc_lint: false
      min_coverage: 89
  performance-repository:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      working_directory: packages/performance_repository
      run_bloc_lint: false
      min_coverage: 99
  pedal-repository:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      working_directory: packages/pedal_repository
      run_bloc_lint: false
      min_coverage: 96
  controller-repository:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      working_directory: packages/controller_repository
      run_bloc_lint: false
      min_coverage: 82

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libglib2.0-dev \
            libpango1.0-dev libasound2-dev clang cmake pkg-config
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --debug --target lib/main_development.dart
      # A clean compile proves the two halves of the bundle build; it does not
      # prove they agree. Dart reaches the engine only through dlsym, which
      # resolves at first call, so a binding naming an entry point the C side
      # never exports links clean and throws on the device instead -- as it did
      # on the appliance on 2026-08-25, repeatedly, off a periodic timer.
      # Compare the two symbol lists against the .so this job just built.
      - name: FFI symbol parity (Dart bindings vs built libsegno_engine.so)
        run: |
          packages/segno_engine/tool/check_ffi_symbols.sh \
            build/linux/*/debug/bundle/lib/libsegno_engine.so

  # ARM64 Linux guard for the Raspberry Pi 5 floor-console target (Pi OS is
  # arm64). Same compile-only contract as build-linux above — no audio runs (CI
  # has no devices) — but on a native arm64 runner so the bundle is built for the
  # Pi's architecture instead of x86_64. A native runner is used rather than
  # FLUTTER_TARGET_PLATFORM_SYSROOT cross-compilation (linux/CMakeLists.txt
  # honors that var) to avoid sysroot/toolchain drift; arm64 runners are free for
  # public repos.
  #
  # subosito/flutter-action is NOT used here: Flutter only publishes prebuilt SDK
  # archives for x64 Linux, so the action fails on arm64 with "Unable to
  # determine Flutter version ... architecture: arm64". Instead Flutter is
  # installed from git — the same way it is set up on an actual Pi — and the
  # tooling fetches the linux-arm64 Dart SDK + engine artifacts on first run.
  # Pinned to 3.44.4 (latest 3.44 patch) to track the 3.44.x the other build jobs
  # use; bump this together with them so the matrix can't silently drift.
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install Flutter (git, arm64 host)
        run: |
          git clone --depth 1 --branch 3.44.4 \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libglib2.0-dev \
            libpango1.0-dev libasound2-dev clang cmake pkg-config
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --debug --target lib/main_development.dart
      # FFI symbol parity, as in build-linux above -- run here too because this
      # job builds for the architecture the appliance actually ships.
      - name: FFI symbol parity (Dart bindings vs built libsegno_engine.so)
        run: |
          packages/segno_engine/tool/check_ffi_symbols.sh \
            build/linux/*/debug/bundle/lib/libsegno_engine.so

  # The native C engine + MIDI unit tests (the deterministic golden gate). They
  # need no audio device, so they run on Linux with just a C toolchain + ALSA
  # headers (the MIDI test links libasound). run_native_tests.sh builds and runs
  # both suites; a failed CHECK returns non-zero and fails the job. A third
  # step below runs the firmware/Dart protocol contract test via
  # firmware/test/run_tests.sh — the single definition of that gate (also the
  # local verify loop), which diffs the two pedal_protocol.{h,c} copies and
  # builds + runs the contract test against both trees, so protocol drift
  # between firmware/segno_pedal and hardware/firmware/segno_pedal_32u4
  # fails the job. This is the strongest correctness gate in the repo — keep
  # it on every PR.
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install C build dependencies
        run: |
          sudo apt-get update
          # libpulse0 (no PulseAudio server running) is not a build dep — it is
          # the CONDITION test_probing_leaks_no_fds needs: miniaudio dlopen()s
          # the Pulse backend, the connect fails with no server, and that is the
          # failure path that leaked a memfd per probe (#721). Without libpulse
          # present the backend is skipped and the test cannot fail.
          sudo apt-get install -y build-essential libasound2-dev libpulse0
      - name: Build + run native engine/MIDI tests
        run: bash packages/segno_engine/src/test/run_native_tests.sh
      - name: Build + run firmware/Dart protocol contract tests (both trees)
        run: bash firmware/test/run_tests.sh

  # Proves the pedal firmware still compiles to a flashable .hex, using the very
  # script appliance-release.yml publishes with (#331 part C). Without this the
  # firmware build would only ever run at release time, on the `experimental`
  # branch or a tag — so a sketch that no longer compiles would land on master
  # green and only surface when a release was already in flight.
  pedal-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install arduino-cli + the AVR core
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 0.35.3
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Compile the pedal firmware
        run: |
          set -eu
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          hardware/firmware/segno_pedal_32u4/build.sh fw-out ci
      - name: Check the artifacts the release manifest reads
        run: |
          set -eu
          test -s fw-out/segno-pedal-ci.hex
          # The manifest interpolates this straight into JSON as a number, so a
          # non-numeric or empty read would publish a manifest that no client
          # can parse.
          proto=$(cat fw-out/protocol-version)
          case "$proto" in ''|*[!0-9]*) echo "::error::bad protocol version '$proto'"; exit 1 ;; esac
          echo "pedal firmware builds; protocol v$proto"

  # The same engine/MIDI suites under AddressSanitizer (#227): the strongest
  # net for buffer-sizing bugs — the class that stays green through every
  # assertion until adversarial review finds it (#218's shadow-slot overflow).
  # ASAN turns any out-of-bounds write into a red job regardless of assertion
  # coverage. Separate from native-tests so a sanitizer-only failure is
  # instantly distinguishable from a logic failure. The firmware protocol test
  # is not repeated here — it is pure fixed-size parsing already covered above.
  native-tests-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install C build dependencies
        run: |
          sudo apt-get update
          # libpulse0 (no PulseAudio server running) is not a build dep — it is
          # the CONDITION test_probing_leaks_no_fds needs: miniaudio dlopen()s
          # the Pulse backend, the connect fails with no server, and that is the
          # failure path that leaked a memfd per probe (#721). Without libpulse
          # present the backend is skipped and the test cannot fail.
          sudo apt-get install -y build-essential libasound2-dev libpulse0
      - name: Build + run native tests under AddressSanitizer
        run: >
          EXTRA_CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g"
          bash packages/segno_engine/src/test/run_native_tests.sh

  # The same suites with the callback telemetry GATED OFF (#722). That gate is
  # the feature's stated escape hatch if the instrument ever perturbs the
  # appliance, so it has to be a configuration that builds AND passes — it is
  # exactly what someone reaches for under pressure, and discovering then that
  # it does not work is the worst possible time. Nothing built it before this
  # job, so the `#if LE_CALLBACK_TELEMETRY` branches in miniaudio.h,
  # engine_miniaudio.c, engine_telemetry.h and the test suite could rot silently
  # while every other job stayed green.
  #
  # It RUNS the suites rather than only compiling them: once the timing-only
  # assertions are behind CHECK_TIMING the gate-off suite passes, so running it
  # costs no more than a compile and additionally pins what the gated build must
  # still do — accumulate nothing, and keep the ungated per-kind dropout tally
  # (which is what leaves xrun_count explainable in every build).
  native-tests-telemetry-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install C build dependencies
        run: |
          set -eu
          sudo apt-get update
          # libpulse0 for the same reason as the two jobs above: without it
          # miniaudio never loads the PulseAudio backend and the #721 fd-leak
          # tests skip rather than run. This job is not about them, but a job
          # that silently skips tests is worse than one that does not have them.
          sudo apt-get install -y build-essential libasound2-dev libpulse0
      - name: Build + run native tests with LE_CALLBACK_TELEMETRY=0
        run: >
          EXTRA_CFLAGS="-DLE_CALLBACK_TELEMETRY=0"
          bash packages/segno_engine/src/test/run_native_tests.sh

  # ThreadSanitizer over the DEDICATED concurrency binary only (#739).
  # test_engine_races.c races the exact thread pairs engine_telemetry.h's
  # writer-ownership note describes — break-raise vs the callback loop, the
  # multi-writer xrun tally vs the arm-path window reset, a control-thread read
  # vs a running callback loop. TSAN deliberately does NOT cover the full
  # native suite: test_engine_core.c drives the engine from single-threaded
  # pumps, so sanitizing it would spend minutes producing a green light that
  # checks nothing — the failure mode #739 exists to avoid. The races binary
  # also runs unsanitized inside native-tests above, because its break-raise
  # handshake asserts a functional liveness property (a raised break is always
  # consumed, and each consume is a real timeline reset) that no sanitizer
  # expresses; this job adds the machine check that every cross-thread access
  # really is the relaxed atomic the ownership note claims.
  native-tests-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install C build dependencies
        run: |
          sudo apt-get update
          # No libasound2-dev / libpulse0 here: the races binary builds from
          # the header-only telemetry plus pthreads, and NATIVE_TESTS_ONLY
          # skips the suites that link the audio backends.
          sudo apt-get install -y build-essential
      - name: Build + run the telemetry race tests under ThreadSanitizer
        run: >
          NATIVE_TESTS_ONLY=races
          EXTRA_CFLAGS="-fsanitize=thread -g"
          bash packages/segno_engine/src/test/run_native_tests.sh

  # The control-sequence fuzzer: the REAL native engine (device-free pump) +
  # the real repository/bloc/cubits, driven by seeded random event sequences
  # and checked against the control-surface invariant spec
  # (lib/control/invariants.dart) after every settled step. Runs as its own
  # job because the reusable flutter_package test job can't build the engine
  # library first; the fuzz tests self-skip without SEGNO_ENGINE_LIB, keeping
  # plain `flutter test` green everywhere. Failures print a seed + a shrunk
  # replayable repro to paste into the corpus.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
      - name: Build the engine test library
        run: echo "SEGNO_ENGINE_LIB=$(bash packages/segno_engine/tool/build_test_lib.sh)" >> "$GITHUB_ENV"
      - name: Run the control-sequence fuzzer
        run: |
          flutter pub get
          flutter test --tags fuzz
      # The looper_repository fingerprint agreement suite (R16) is fuzz-tagged
      # and self-skips without SEGNO_ENGINE_LIB — the per-package job above
      # skips it by design, so run it HERE against the engine library this job
      # already built, or the mixed-enabled agreement guarantee would be
      # silently skipped everywhere.
      - name: Run the looper_repository native agreement tests
        working-directory: packages/looper_repository
        run: |
          flutter pub get
          flutter test --tags fuzz

  # Linux port (part 14): the same seven plugins + CTest suite with gcc/clang. The
  # default generator on ubuntu is single-config (Makefiles), so the build type is
  # CMAKE_BUILD_TYPE (Debug gives the SDK its DEVELOPMENT=1), like the macOS job.
  vst3-plugins-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install C/C++ build dependencies
        run: |
          sudo apt-get update
          # libasound2-dev: the engine's src/CMakeLists.txt (pulled in via
          # add_subdirectory) runs find_package(ALSA REQUIRED) at configure time
          # even though EXCLUDE_FROM_ALL means its ALSA-linking segno_engine target
          # is never built here — matches build-linux / native-tests.
          sudo apt-get install -y build-essential cmake libasound2-dev
      - name: Configure + build + test the VST3 plugins
        run: |
          cmake -S packages/segno_engine/vst3 -B build/vst3 -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/vst3
          ctest --test-dir build/vst3 --output-on-failure

  # The refusal paths of `segno-update-ctl flash-pedal` (#331 part D). The flash
  # itself needs a real Pro Micro, but the decisions AROUND it are the dangerous
  # part: the pedal has no A/B rollback, so a write that should not have started
  # means a workbench trip with a sealed enclosure. The harness injects a
  # file:// manifest, a fixture serial dir, and a stub avrdude — no hardware.
  #
  # Also runs the other appliance shell suites, which share the same shape
  # (inject every path, stub the privileged call). The job keeps its original
  # name so existing required-check settings do not break.
  flash-pedal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run flash-pedal safety tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_flash_pedal_tests.sh
      - name: Run bt-persist tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_bt_persist_tests.sh
      - name: Run bt-ctl device-verb tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_bt_ctl_tests.sh
      - name: Run wifi-regdom tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_regdom_tests.sh
      - name: Run wifi-backend ownership tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_backend_tests.sh
      - name: Run wifi join-error classification tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_join_error_tests.sh
      - name: Run wifi saved-network tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_saved_tests.sh
      - name: Run mark-good tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_mark_good_tests.sh
      - name: Run log-persistence tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_log_persist_tests.sh
      - name: Run weston log tests
        run: bash deploy/yocto/meta-segno/recipes-graphics/weston-init/test/run_weston_log_tests.sh
      # Twice on purpose: the appliance's /bin/sh is busybox ash, so the
      # scripts must hold under a strict POSIX shell (dash) as well as bash.
      - name: Run reconcile-staged tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_reconcile_staged_tests.sh
      - name: Run reconcile-staged tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_reconcile_staged_tests.sh

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
      modified_files_only: false
