name: segno

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Which parts of the tree the change touches (#1771), so the jobs that only
  # test native code, the firmware or the appliance scripts skip on a PR that
  # changes none of it. A skipped job still reports its check (as skipped,
  # which counts as passing), so a filtered job never leaves a check missing
  # or pending. A skipped matrix job reports one check, under its unexpanded
  # name ("native-tests-asan (${{ matrix.part }})"). On a push every job
  # runs. The workflow file is in every filter, so a CI change runs
  # everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      pedal_link: ${{ github.event_name != 'pull_request' || steps.filter.outputs.pedal_link == 'true' }}
      firmware: ${{ github.event_name != 'pull_request' || steps.filter.outputs.firmware == 'true' }}
      deploy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deploy == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            native:
              - '.github/workflows/main.yaml'
              - 'packages/segno_engine/src/**'
              - 'packages/segno_engine/third_party/**'
              - 'packages/segno_engine/tool/**'
              - 'packages/segno_engine/macos/**'
            # The console link contract test in native-tests
            # (firmware/test/run_tests.sh): the firmware, the Dart codec's
            # golden frames, and the ring updater it builds.
            pedal_link:
              - '.github/workflows/main.yaml'
              - 'firmware/**'
              - 'packages/pedal_repository/**'
              - 'deploy/yocto/meta-segno/recipes-segno/segno-console-board/files/**'
            firmware:
              - '.github/workflows/main.yaml'
              - 'firmware/**'
            # The appliance shell suites also build the console and ring
            # firmware's link code, read the engine's real-time priorities,
            # and compare exit codes with the app's appliance_env.dart.
            deploy:
              - '.github/workflows/main.yaml'
              - 'deploy/**'
              - 'firmware/**'
              - 'packages/segno_engine/src/**'
              - 'lib/update/appliance/**'

  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v2

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_version: "3.50.x"
      run_bloc_lint: true
      # segno_engine's build hook compiles the engine for `flutter test`; its
      # Linux MIDI backend needs the ALSA headers (#1783).
      setup: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # format_directories/analyze_directories default to "lib test", which
      # only covers the root app. Glob in every package's lib/ + test/ too, so
      # `dart format --set-exit-if-changed` and `flutter analyze` actually gate
      # the 13 packages/* (daw_export, segno_engine, etc.) instead of silently
      # skipping them. The glob is spliced into a plain bash step by the
      # reusable workflow, so it self-expands as packages are added/removed —
      # no need to edit this list when packages/* changes.
      format_directories: "lib test packages/*/lib packages/*/test"
      analyze_directories: "lib test packages/*/lib packages/*/test"
      # Keep the 90% gate for real logic, but exclude platform / entrypoint glue
      # that can't be meaningfully unit-tested: the Track display's app and its
      # link service, and the app bootstrap/entrypoint. Coverage on the
      # remainder stays ~91%.
      min_coverage: 90
      coverage_excludes: "**/waveform_window*.dart **/run_segno.dart **/bootstrap.dart **/session_directory.dart **/system_appliance_env.dart"

  # The packages' own suites (#1771): the root `build` job tests only the
  # root app, so each package's tests and coverage floor run here, one job
  # for all of them where they were a Very Good workflow job each. The root
  # job already formats and analyzes every package. The floors, and which
  # packages run, are in tool/run_package_tests.sh. The two whole-app scans
  # also run in this job, since they need the same resolved dependencies:
  #   - no app code, and no package the app runs, may start a program through
  #     dart:io (#1367): Process.run and Process.start fork the app, which
  #     stalls the audio thread, and a dart:io child running beside
  #     spawn_process takes the exit status of its children;
  #   - no method, function or getter in lib/ or packages/*/lib may return a
  #     widget (#1697): UI is built from widget classes.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.x"
          channel: stable
          cache: true
      # segno_engine's build hook compiles the engine for every flutter test
      # run; its Linux MIDI backend needs the ALSA headers (#1783).
      - name: Install the ALSA headers
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libasound2-dev
          version: "1"
      - name: Resolve the app's and every package's dependencies
        run: |
          dart pub global activate very_good_cli 1.5.0
          very_good packages get --recursive
      - name: Run the package suites against their coverage floors
        run: bash tool/run_package_tests.sh
      - name: Check the app and its runtime dependencies for dart:io process starts
        if: ${{ !cancelled() }}
        run: bash tool/check_no_dart_process.sh
      - name: No widget-returning methods
        if: ${{ !cancelled() }}
        run: dart run tool/check_no_widget_methods.dart
  # The design side of a UI change. The design is the Penpot file segno-ui
  # (#1503); its snapshots, the frozen segno-ui.pen and the design studies
  # live in tomassasovsky/segno-design (#1496), cloned next to this checkout
  # as they are for local UI work. The job runs the checks that read the
  # studies, and renders the screenshot suites on Linux and uploads the PNGs
  # as the `screenshots` artifact, for a reviewer to compare against the
  # Penpot file. No goldens are committed, so no pixels are compared here,
  # but a suite that fails to render fails the job. Suites already known to
  # fail are skipped, each with a comment naming its issue.
  #
  # The clone is the segno-design commit in .github/segno-design.sha, so the
  # result depends only on this commit. A change that needs a newer study
  # (normally a UI change and its design PR) updates that file. Only
  # docs/design/ is checked out, and only its blobs are downloaded: the
  # Penpot snapshot (about 117,000 files) and the pen are not needed here.
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone segno-design next to the checkout, at the pinned commit
        id: design-clone
        run: |
          git init -q ../segno-design
          git -C ../segno-design remote add origin \
            https://github.com/tomassasovsky/segno-design.git
          git -C ../segno-design sparse-checkout set --no-cone /docs/design/
          git -C ../segno-design fetch -q --depth 1 --filter=blob:none \
            origin "$(cat .github/segno-design.sha)"
          git -C ../segno-design checkout -q FETCH_HEAD
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.x"
          channel: stable
          cache: true
      # segno_engine's build hook compiles the engine for every flutter test
      # run; its Linux MIDI backend needs the ALSA headers (#1783).
      - name: Install the ALSA headers
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libasound2-dev
          version: "1"
      - name: Resolve the app's dependencies
        id: pub-get
        run: flutter pub get
      - name: Render the screenshot suites
        id: render
        run: flutter test --tags screenshots --update-goldens test/screenshots
      - name: Upload the screenshots
        if: always() && steps.render.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test/screenshots/goldens/
          if-no-files-found: error
      - name: Check the app against the design studies
        if: always() && steps.design-clone.outcome == 'success' && steps.pub-get.outcome == 'success'
        run: flutter test test/control/external_pedal_art_test.dart

  # The appliance bundle: the exact build the release ships, in the same
  # container (deploy/rpi/build) on a native arm64 runner, with the Flutter
  # release whose engine the image carries. There is no desktop runner: the app
  # is built with `flutter assemble` and the engine with its own CMake project.
  appliance-bundle:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build the appliance bundle
        run: |
          flutter_version=$(sed -n 's/^FLUTTER_ENGINE_VERSION = "\(.*\)"$/\1/p' \
            deploy/yocto/meta-segno/recipes-graphics/flutter-engine/flutter-engine-version.inc)
          docker build --build-arg "FLUTTER_VERSION=$flutter_version" \
            -t segno-bundle-build deploy/rpi/build
          docker run --rm -v "$PWD":/workspace segno-bundle-build
      # A clean build proves the two halves of the bundle build; it does not
      # prove they agree. Dart reaches the engine only through dlsym, which
      # resolves at first call, so a binding naming an entry point the C side
      # never exports links clean and throws on the device instead -- as it did
      # on the appliance on 2026-08-25, repeatedly, off a periodic timer.
      # Compare the two symbol lists against the .so this job just built.
      - name: FFI symbol parity (Dart bindings vs built libsegno_engine.so)
        run: |
          packages/segno_engine/tool/check_ffi_symbols.sh \
            build/appliance/bundle/lib/libsegno_engine.so

  # The #1179 pitch/time and #1197 instrument CPU proxies: the bench harnesses
  # on the same native arm64 runner as appliance-bundle, asserting the arm64
  # PROXY thresholds (p50 and throughput only — a shared Neoverse VM without
  # SCHED_FIFO has no meaningful p99) at half the Pi 5 figures. The Pi 5
  # thresholds themselves are a hardware criterion (Part 1 of
  # docs/plan/2026-10-06-feat-pitch-time-core-plan.md and of
  # docs/plan/2026-10-06-feat-instruments-plan.md): each built binary is
  # uploaded as an artifact so the owner can copy it to the appliance and run
  # it with `--budget-us 667 --assert` there. upload-artifact does not keep
  # file modes: `chmod +x` the binary on the appliance before running it.
  native-bench-arm64:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The runner image has GCC and Clang 18; only the `clang` name may be
      # missing (it comes with Ubuntu's `clang` metapackage), so the Clang
      # steps below take the versioned binary's path from here rather than
      # installing anything (#1771).
      - name: Find Clang
        run: |
          set -eu
          clang=$(command -v clang || ls /usr/bin/clang-[0-9]* | sort -V | tail -n 1)
          "$clang" --version
          echo "CLANG=$clang" >> "$GITHUB_ENV"
      # Compiler output from earlier runs (#1771): a TU that has not changed
      # is not compiled again. ccache is downloaded from its GitHub release.
      # One entry per job and PR, saved by the PR's first run and restored
      # by its later ones: without the timestamp each run would add another
      # entry, and the repository's 10 GB of cache is shared by every job.
      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ${{ github.job }}
          install: binary
          append-timestamp: false
          max-size: 100M
      - name: Build + run the pitch/time bench (arm64 proxy thresholds)
        # `shell: bash` runs the step as `bash -eo pipefail`. The default shell
        # has no pipefail, so the pipeline would exit with tee's status and a
        # failed threshold (or a failed build) would leave the job green.
        shell: bash
        run: >
          bash packages/segno_engine/src/test/bench/bench_pitch_time.sh
          --budget-us 667 --assert --proxy --seconds 20
          | tee bench-pitch-time-arm64.md
      - name: Upload the harness and its report for the appliance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-pitch-time-arm64
          path: |
            packages/segno_engine/build/bench/bench_pitch_time
            bench-pitch-time-arm64.md
          if-no-files-found: error
      # The #1197 instrument voice bench: the same proxy rule (p50 at half the
      # Pi 5 percentages), its binary uploaded for the owner's appliance run
      # (docs/plan/2026-10-06-instruments-spike-findings.md, "Pi 5").
      - name: Build + run the instrument voice bench (arm64 proxy thresholds)
        if: always()
        shell: bash
        run: >
          bash packages/segno_engine/src/test/bench/bench_instruments.sh
          --budget-us 667 --assert --proxy --seconds 20
          | tee bench-instruments-arm64.md
      - name: Upload the instrument bench and its report for the appliance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-instruments-arm64
          path: |
            packages/segno_engine/build/bench/bench_instruments
            bench-instruments-arm64.md
          if-no-files-found: error
      # The Looper X kinds' CPU (#887): informational on this proxy, judged
      # against the plan's per-rack budgets on the console. The binary is
      # uploaded for that run.
      - name: Run the effects bench for the Looper X kinds (informational)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # The script builds the bench once; the other kinds rerun it.
          bash packages/segno_engine/src/test/bench/bench_fx_cpu.sh \
            --kind eq --blocks 2000 > bench-fx-kinds-arm64.md
          for kind in comp transient hpgate doubler chorus wah overdrive \
              distortion vinyl degrade lpf lpflfo spring dubverb ambverb whammy pumper \
              slicer modedelay drumdelay dubdelay dualoct ampcab mod roomverb smarttune; do
            packages/segno_engine/build/bench/bench_fx_cpu \
              --kind "$kind" --blocks 2000 >> bench-fx-kinds-arm64.md
          done
          packages/segno_engine/build/bench/bench_fx_cpu \
            --racks --blocks 2000 >> bench-fx-kinds-arm64.md
          packages/segno_engine/build/bench/bench_fx_cpu \
            --table --blocks 2000 >> bench-fx-kinds-arm64.md
          cat bench-fx-kinds-arm64.md
      # The pitch-shifter comparison (#887 part 9): the phase vocoder, PSOLA
      # and Signalsmith Stretch on the same signals. Informational.
      - name: Run the pitch-shifter comparison (informational)
        if: always()
        continue-on-error: true
        shell: bash
        run: >
          bash packages/segno_engine/src/test/bench/bench_pitch_algos.sh
          | tee bench-pitch-algos-arm64.md
      # The nonlinear kinds' aliasing at 48 kHz against 96 kHz (#1540).
      # Informational, but it must build and run: it is rerun after any
      # oversampling change.
      - name: Run the aliasing bench
        if: always()
        shell: bash
        run: >
          bash packages/segno_engine/src/test/bench/bench_alias.sh
          | tee bench-alias-arm64.md
      # The pitch kinds against their kernels before #1755, built with
      # Clang, the console's compiler: their NEON paths build only there,
      # so native-tests (x86, GCC) holds the scalar ones and this the NEON.
      - name: Run the pitch kinds' oracle with Clang
        if: always()
        shell: bash
        run: |
          CC="$CLANG" CXX="${CLANG/clang/clang++}" \
            bash packages/segno_engine/src/test/run_pitch_oracle.sh --ci
      # The effects matrix (#1547): its CI subset runs in native-tests; this
      # builds the full run's binary for the console, where the owner runs
      # it, and runs the subset on arm64 too.
      - name: Run the effects matrix subset
        if: always()
        shell: bash
        run: bash packages/segno_engine/src/test/bench/bench_fx_matrix.sh --ci
      # The kinds against the reference engine's render (#1755) where the
      # vector code runs as NEON: with GCC, and with clang at -O3, the
      # appliance library's compiler and level.
      - name: Run the effects equivalence subset (gcc, clang -O3)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bash packages/segno_engine/src/test/bench/bench_fx_equiv.sh --ci
          CC="$CLANG" FX_EQUIV_OPT=-O3 \
            bash packages/segno_engine/src/test/bench/bench_fx_equiv.sh --ci
      - name: Upload the effects bench and its report for the appliance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-fx-cpu-arm64
          path: |
            packages/segno_engine/build/bench/bench_fx_cpu
            packages/segno_engine/build/bench/bench_pitch_algos
            packages/segno_engine/build/bench/bench_alias
            packages/segno_engine/build/bench/bench_fx_matrix
            bench-fx-kinds-arm64.md
            bench-pitch-algos-arm64.md
            bench-alias-arm64.md
          if-no-files-found: error
      # The audio-thread fault bench (#900): build only, since it needs the
      # console's sound card. Its binary is uploaded for the on-device proof
      # run (usage in bench_rt_faults.sh).
      - name: Build the audio-thread fault bench
        if: always()
        run: bash packages/segno_engine/src/test/bench/bench_rt_faults.sh
      - name: Upload the audio-thread fault bench for the appliance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-rt-faults-arm64
          path: packages/segno_engine/build/bench/bench_rt_faults
          if-no-files-found: error
      # The xrun recovery bench (#1516): build only, for the same reason.
      - name: Build the xrun recovery bench
        if: always()
        run: bash packages/segno_engine/src/test/bench/bench_xrun_recovery.sh
      - name: Upload the xrun recovery bench for the appliance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-xrun-recovery-arm64
          path: packages/segno_engine/build/bench/bench_xrun_recovery
          if-no-files-found: error

  # The native C engine + MIDI unit tests (the deterministic golden gate). They
  # need no audio device, so they run on Linux with just a C toolchain + ALSA
  # headers (the MIDI test links libasound). run_native_tests.sh builds and runs
  # both suites; a failed CHECK returns non-zero and fails the job. A second
  # step runs the pedal-link contract test via
  # firmware/test/run_tests.sh — the single definition of that gate (also
  # the local verify loop): the console board firmware's pedal_link.c
  # decodes and re-encodes the golden frames packages/pedal_repository
  # generates from the Dart codec, so drift between the two fails the job.
  # This is the strongest correctness gate in the repo — keep it on every PR
  # that touches native code (the `changes` job above says which do).
  native-tests:
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.pedal_link == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The ALSA headers, and libpulse0 (no PulseAudio server running): not
      # a build dep but the CONDITION test_probing_leaks_no_fds needs —
      # miniaudio dlopen()s the Pulse backend, the connect fails with no
      # server, and that is the failure path that leaked a memfd per probe
      # (#721). Without libpulse present the backend is skipped and the test
      # cannot fail. The packages come from the Actions cache when it has
      # them, so the job does not need Ubuntu's mirrors (#1771); the
      # compilers are the runner image's own.
      - name: Install the ALSA headers and libpulse0
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libasound2-dev libpulse0
          version: "1"
      # Compiler output from earlier runs (#1771): a TU that has not changed
      # is not compiled again. ccache is downloaded from its GitHub release.
      # One entry per job and PR, saved by the PR's first run and restored
      # by its later ones: without the timestamp each run would add another
      # entry, and the repository's 10 GB of cache is shared by every job.
      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ${{ github.job }}
          install: binary
          append-timestamp: false
          max-size: 100M
      - name: Build + run native engine/MIDI tests
        run: bash packages/segno_engine/src/test/run_native_tests.sh
      # The #1179 pitch/time bench (src/test/bench/bench_pitch_time.{c,sh}) is
      # outside the test gate, so this one-second smoke run is what keeps it
      # compiling and running; the arm64 proxy thresholds are asserted by
      # native-bench-arm64 below.
      - name: Build + smoke the pitch/time bench
        run: bash packages/segno_engine/src/test/bench/bench_pitch_time.sh --smoke
      # The #1197 instrument voice bench (src/test/bench/bench_instruments.{c,sh}),
      # kept compiling and running the same way; its arm64 proxy thresholds are
      # asserted by native-bench-arm64.
      - name: Smoke-run the instrument voice bench
        run: bash packages/segno_engine/src/test/bench/bench_instruments.sh --smoke
      # The #915 built-in effects bench (src/test/bench/bench_fx_cpu.{c,sh}),
      # kept compiling and running the same way; its numbers come from the
      # console, not from CI.
      - name: Smoke-run the effects bench
        run: bash packages/segno_engine/src/test/bench/bench_fx_cpu.sh --smoke
      # The #1515 multi-core effects spike (src/test/bench/bench_fx_parallel.{c,sh}),
      # kept compiling against the engine's internals; its numbers come from
      # the console, not from CI.
      - name: Smoke-run the multi-core effects spike
        run: bash packages/segno_engine/src/test/bench/bench_fx_parallel.sh --smoke --chains 2 --workers 1
      - name: Build + run the pedal-link contract test (firmware C vs Dart fixtures)
        run: bash firmware/test/run_tests.sh

  # Proves the console board firmware (Pico 2 / RP2350) and the ring carrier's
  # XIAO RP2350 firmware still compile. Without this a sketch that no longer
  # builds would land on master green and only surface at the next bench flash.
  # The arduino-pico core is what the local build uses
  # (firmware/console_board/README.md).
  console-firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install arduino-cli
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.1.1
          echo "$PWD/bin" >> "$GITHUB_PATH"
      # The core download comes from the package server on every run, and its
      # 504s were failing unrelated PRs; a pinned core never changes, so cache it.
      # ci-caches.yaml saves it on the trunk under the same key, so a PR finds
      # it there (#1771): change the two together.
      - name: Cache the Arduino core and libraries
        id: arduino-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-rp2040-6.0.0-neopixel-1.15.5-bus-2.8.4
      - name: Install the RP2040/RP2350 core and LED drivers
        if: steps.arduino-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          arduino-cli core update-index --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040@6.0.0 --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli lib install "Adafruit NeoPixel@1.15.5" "NeoPixelBus by Makuna@2.8.4"
      - name: Compile the console board firmware
        run: |
          set -eu
          arduino-cli compile --libraries firmware/libraries --fqbn rp2040:rp2040:rpipico2 firmware/console_board --output-dir fw-out
          test -s fw-out/console_board.ino.elf
          test -s fw-out/console_board.ino.uf2
      - name: Compile the ring carrier firmware
        run: |
          set -eu
          arduino-cli compile --libraries firmware/libraries --fqbn rp2040:rp2040:seeed_xiao_rp2350 firmware/ring_board --output-dir ring-out
          test -s ring-out/ring_board.ino.uf2
      # The update image (TBYB) and the USB install (not), with the core's
      # picotool: a core whose image layout seal.py no longer understands
      # fails here rather than on a ring.
      - name: Seal the ring carrier firmware
        run: |
          set -eu
          python3 -I firmware/ring_board/seal.py ring-out/ring_board.ino.bin ring-sealed
          for f in ring_board.bin ring_board.uf2 partition_table.uf2 version; do test -s "ring-sealed/$f"; done
          cat ring-sealed/version

  # The same engine/MIDI suites under AddressSanitizer (#227): the strongest
  # net for buffer-sizing bugs — the class that stays green through every
  # assertion until adversarial review finds it (#218's shadow-slot overflow).
  # ASAN turns any out-of-bounds write into a red job regardless of assertion
  # coverage. Separate from native-tests so a sanitizer-only failure is
  # instantly distinguishable from a logic failure. The firmware protocol test
  # is not repeated here — it is pure fixed-size parsing already covered above.
  #
  # It runs as three jobs (#1771). Four sanitized processes on one runner's
  # four vCPUs (two cores, two threads each) run at about half speed each,
  # so on one runner the suite took 14 minutes however it was spread. Each
  # part builds only what it runs; two take half the core suite's 16 shards
  # each, the third the rest, and the second also runs the race binaries.
  native-tests-asan:
    name: native-tests-asan (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: core 1 of 2
            only: core
            core_part: 0/2
          - part: core 2 of 2, races
            only: core,races
            core_part: 1/2
          - part: the rest
            only: rest
            core_part: 0/1
    steps:
      - uses: actions/checkout@v7
      # The ALSA headers, and libpulse0 (no PulseAudio server running): not
      # a build dep but the CONDITION test_probing_leaks_no_fds needs —
      # miniaudio dlopen()s the Pulse backend, the connect fails with no
      # server, and that is the failure path that leaked a memfd per probe
      # (#721). Without libpulse present the backend is skipped and the test
      # cannot fail. The packages come from the Actions cache when it has
      # them, so the job does not need Ubuntu's mirrors (#1771); the
      # compilers are the runner image's own.
      - name: Install the ALSA headers and libpulse0
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libasound2-dev libpulse0
          version: "1"
      # Compiler output from earlier runs (#1771): a TU that has not changed
      # is not compiled again. ccache is downloaded from its GitHub release.
      # One entry per job and PR, saved by the PR's first run and restored
      # by its later ones: without the timestamp each run would add another
      # entry, and the repository's 10 GB of cache is shared by every job.
      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          install: binary
          append-timestamp: false
          max-size: 100M
      - name: Build + run native tests under AddressSanitizer
        # The decoder fuzz driver also runs under UBSan, for longer (#1200).
        run: >
          EXTRA_CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g"
          FUZZ_CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined"
          SEGNO_FUZZ_ITERATIONS=20000
          NATIVE_TESTS_ONLY="${{ matrix.only }}"
          SEGNO_CORE_PART="${{ matrix.core_part }}"
          bash packages/segno_engine/src/test/run_native_tests.sh

  # The same suites with the callback telemetry GATED OFF (#722). That gate is
  # the feature's stated escape hatch if the instrument ever perturbs the
  # appliance, so it has to be a configuration that builds AND passes — it is
  # exactly what someone reaches for under pressure, and discovering then that
  # it does not work is the worst possible time. Nothing built it before this
  # job, so the `#if LE_CALLBACK_TELEMETRY` branches in miniaudio.h,
  # engine_miniaudio.c, engine_telemetry.h and the test suite could rot silently
  # while every other job stayed green.
  #
  # It RUNS the suites rather than only compiling them: once the timing-only
  # assertions are behind CHECK_TIMING the gate-off suite passes, so running it
  # costs no more than a compile and additionally pins what the gated build must
  # still do — accumulate nothing, and keep the ungated per-kind dropout tally
  # (which is what leaves xrun_count explainable in every build).
  native-tests-telemetry-off:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # libpulse0 for the same reason as the two jobs above: without it
      # miniaudio never loads the PulseAudio backend and the #721 fd-leak
      # tests skip rather than run. This job is not about them, but a job
      # that silently skips tests is worse than one that does not have them.
      - name: Install the ALSA headers and libpulse0
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libasound2-dev libpulse0
          version: "1"
      # Compiler output from earlier runs (#1771): a TU that has not changed
      # is not compiled again. ccache is downloaded from its GitHub release.
      # One entry per job and PR, saved by the PR's first run and restored
      # by its later ones: without the timestamp each run would add another
      # entry, and the repository's 10 GB of cache is shared by every job.
      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ${{ github.job }}
          install: binary
          append-timestamp: false
          max-size: 100M
      - name: Build + run native tests with LE_CALLBACK_TELEMETRY=0
        run: >
          EXTRA_CFLAGS="-DLE_CALLBACK_TELEMETRY=0"
          bash packages/segno_engine/src/test/run_native_tests.sh

  # ThreadSanitizer over the DEDICATED concurrency binary only (#739).
  # test_engine_races.c races the exact thread pairs engine_telemetry.h's
  # writer-ownership note describes — break-raise vs the callback loop, the
  # multi-writer xrun tally vs the arm-path window reset, a control-thread read
  # vs a running callback loop. TSAN deliberately does NOT cover the full
  # native suite: test_engine_core.c drives the engine from single-threaded
  # pumps, so sanitizing it would spend minutes producing a green light that
  # checks nothing — the failure mode #739 exists to avoid. The races binary
  # also runs unsanitized inside native-tests above, because its break-raise
  # handshake asserts a functional liveness property (a raised break is always
  # consumed, and each consume is a real timeline reset) that no sanitizer
  # expresses; this job adds the machine check that every cross-thread access
  # really is the relaxed atomic the ownership note claims.
  native-tests-tsan:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # No packages to install: the race binaries build from the runner
      # image's compilers, the header-only telemetry and pthreads, and
      # NATIVE_TESTS_ONLY skips the suites that link the audio backends.
      # Compiler output from earlier runs (#1771): a TU that has not changed
      # is not compiled again. ccache is downloaded from its GitHub release.
      # One entry per job and PR, saved by the PR's first run and restored
      # by its later ones: without the timestamp each run would add another
      # entry, and the repository's 10 GB of cache is shared by every job.
      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ${{ github.job }}
          install: binary
          append-timestamp: false
          max-size: 100M
      - name: Build + run the telemetry race tests under ThreadSanitizer
        run: >
          NATIVE_TESTS_ONLY=races
          EXTRA_CFLAGS="-fsanitize=thread -g"
          bash packages/segno_engine/src/test/run_native_tests.sh

  # segno_engine's own Dart suite. The root `build` job tests only the app,
  # and tool/run_package_tests.sh does not list this package, so it runs
  # here. Since #1783 every native-backed suite runs wherever its package is
  # tested: the build hook compiles the engine for each `flutter test` run,
  # so the control-sequence fuzzer (test/fuzz/) runs in `build`, and the
  # repositories' native suites in `packages`.
  segno-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.x"
          channel: stable
          cache: true
      # segno_engine's build hook compiles the engine for every flutter test
      # run; its Linux MIDI backend needs the ALSA headers (#1783).
      - name: Install the ALSA headers
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libasound2-dev
          version: "1"
      - name: Run the segno_engine package tests
        working-directory: packages/segno_engine
        run: |
          flutter pub get
          flutter test

  # The appliance shell suites (wifi, mark-good, journal persist, the kernel
  # cmdline, reconcile-staged, the update attempt marker), which share one
  # shape: inject every path, stub the privileged call — no hardware.
  appliance-shell-tests:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shell-test tools
        run: sudo apt-get update && sudo apt-get install -y jq rauc squashfs-tools
      - name: Inspect update bundle test artifacts
        run: bash deploy/yocto/meta-segno/recipes-core/images/test/run_bundle_slots_tests.sh
      - name: Run bundle collection tests
        run: bash deploy/yocto/meta-segno/recipes-core/images/test/run_bundle_collection_tests.sh
      - name: Run update bundle hook tests
        run: bash deploy/yocto/meta-segno/recipes-core/images/test/run_bundle_hook_tests.sh
      - name: Run boot-slot recipe tests
        run: bash deploy/yocto/meta-segno/recipes-core/bootfs/test/run_bootfs_tests.sh
      - name: Run console-board flash tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-console-board/test/run_console_flash_tests.sh
      - name: Run console-board flash record tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-console-board/test/run_flash_record_tests.sh
      - name: Run ring-board flash tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-console-board/test/run_ring_flash_tests.sh
      # Twice: the appliance's /bin/sh is busybox ash, so the helper must hold
      # under a strict POSIX shell (dash) as well as bash.
      - name: Run usb-ctl tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_usb_ctl_tests.sh
      - name: Run usb-ctl tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_usb_ctl_tests.sh
      - name: Run wifi-regdom tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_regdom_tests.sh
      - name: Run wifi-backend ownership tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_backend_tests.sh
      - name: Run wifi join-error classification tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_join_error_tests.sh
      - name: Run wifi saved-network tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_saved_tests.sh
      - name: Run wifi boot-retry tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_retry_tests.sh
      - name: Run wifi network-management tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_wifi_manage_tests.sh
      # Twice: the appliance's /bin/sh is busybox ash, so the helper must hold
      # under a strict POSIX shell (dash) as well as bash.
      - name: Run brightness-ctl tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_brightness_tests.sh
      - name: Run brightness-ctl tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_brightness_tests.sh
      - name: Run touch-ctl tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_touch_ctl_tests.sh
      - name: Run touch-ctl tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_touch_ctl_tests.sh
      - name: Run screen capture tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_capture_tests.sh
      - name: Run screen capture tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_capture_tests.sh
      - name: Run mark-good tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_mark_good_tests.sh
      - name: Run mark-good tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_mark_good_tests.sh
      - name: Run update-ctl reboot and poweroff tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_reboot_tests.sh
      - name: Run update-ctl reboot and poweroff tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_reboot_tests.sh
      - name: Run log-persistence tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_log_persist_tests.sh
      - name: Run kernel cmdline tests
        run: bash deploy/yocto/test/run_kernel_cmdline_tests.sh
      - name: Run boot partition wiring tests
        run: bash deploy/yocto/test/run_boot_partition_tests.sh
      - name: Run freeze recovery tests
        run: bash deploy/yocto/test/run_freeze_recovery_tests.sh
      - name: Run freeze watchdog tests
        run: bash deploy/yocto/meta-segno/recipes-segno/segno-freeze-watchdog/test/run_freeze_watchdog_tests.sh
      - name: Run screen power lifecycle tests
        run: python3 deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/test_screen_power.py
      # Twice on purpose: the appliance's /bin/sh is busybox ash, so the
      # scripts must hold under a strict POSIX shell (dash) as well as bash.
      - name: Run reconcile-staged tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_reconcile_staged_tests.sh
      - name: Run reconcile-staged tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_reconcile_staged_tests.sh
      - name: Run update attempt-marker tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_update_attempt_tests.sh
      - name: Run update attempt-marker tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_update_attempt_tests.sh
      - name: Run update-from-file tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_update_file_tests.sh
      - name: Run update-from-file tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_update_file_tests.sh
      - name: Run update read-only boot tests (bash)
        run: TEST_SHELL=bash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_boot_read_only_tests.sh
      - name: Run update read-only boot tests (dash)
        run: TEST_SHELL=dash bash deploy/yocto/meta-segno/recipes-segno/segno-bundle/test/run_boot_read_only_tests.sh

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v2
    with:
      includes: |
        **/*.md
      modified_files_only: false
