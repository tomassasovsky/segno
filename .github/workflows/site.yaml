name: Site

# Builds the static website in site/ into an nginx image. Pushes to the trunk
# and master publish ghcr.io/tomassasovsky/segno-site:latest; the home server's
# watchtower pulls it within five minutes. Pull requests only build it.

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yaml'
  push:
    branches: [claude/segno-integration, master]
    paths:
      - 'site/**'
      - '.github/workflows/site.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: site
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tomassasovsky/segno-site:latest
            ghcr.io/tomassasovsky/segno-site:${{ github.sha }}
