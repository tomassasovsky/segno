name: appliance-profile-bundle

# Builds a PROFILE-mode arm64 Linux bundle and uploads it as an artifact, so the
# appliance UI can be profiled with DevTools on a real Pi.
#
# Why this exists: the shipped appliance bundle is release-mode AOT (no
# kernel_blob.bin, no VM service), so DevTools cannot attach to it, and the Yocto
# image is a pure runtime with no toolchain (no flutter/dart/gcc/ninja) so it
# cannot build one itself. Cross-compiling a Linux arm64 bundle from macOS is not
# supported either. An arm64 CI runner is the only path that needs no extra local
# setup. See #638.
#
# Not part of PR CI on purpose: this produces a ~100MB artifact and profiling is
# an occasional, deliberate act. It runs on demand, or on a push to a perf/**
# branch (which is also what makes it dispatchable before it reaches master --
# workflow_dispatch only lists workflows present on the default branch).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Entrypoint to build"
        required: false
        default: lib/main_production.dart
  push:
    branches:
      - "perf/**"

jobs:
  profile-bundle:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same version as the build-linux-arm64 guard in main.yaml.
      # Keep the two in step: a bundle built against a different engine than the
      # one the appliance ships would make the profile misleading.
      - name: Install Flutter (git, arm64 host)
        run: |
          git clone --depth 1 --branch 3.44.4 \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libglib2.0-dev \
            libpango1.0-dev libasound2-dev clang cmake pkg-config

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get

      - name: Build profile bundle
        run: |
          flutter build linux --profile \
            --target "${{ inputs.target || 'lib/main_production.dart' }}"

      # The bundle is what deploy/rpi/profile-on-device.sh expects to be handed:
      # the whole directory, binary + data/ + lib/, not a tarball of the repo.
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: segno-linux-arm64-profile
          path: build/linux/arm64/profile/bundle/
          if-no-files-found: error
          retention-days: 14
