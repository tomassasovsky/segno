name: appliance-profile-bundle

# Builds a PROFILE-mode appliance bundle, with the profile Flutter engine, and
# uploads it as an artifact, so the appliance UI can be profiled with DevTools on
# a real Pi (deploy/rpi/profile-on-device.sh).
#
# Why this exists: the shipped appliance bundle is release-mode AOT on the
# release engine (no VM service), so DevTools cannot attach to it, and the Yocto
# image is a pure runtime with no toolchain, so it cannot build one itself. The
# build is the release bundle's own: the deploy/rpi/build container with
# `segno-build --profile`, on the Flutter release whose engine the image ships.
# See #638.
#
# Not part of PR CI on purpose: this produces a ~100MB artifact and profiling is
# an occasional, deliberate act. It runs on demand, or on a push to a perf/**
# branch (which is also what makes it dispatchable before it reaches master --
# workflow_dispatch only lists workflows present on the default branch).

on:
  workflow_dispatch:
  push:
    branches:
      - "perf/**"

permissions:
  contents: read

jobs:
  profile-bundle:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Read the Flutter version the image ships
        id: pin
        run: |
          v=$(sed -n 's/^FLUTTER_ENGINE_VERSION = "\(.*\)"$/\1/p' \
            deploy/yocto/meta-segno/recipes-graphics/flutter-engine/flutter-engine-version.inc)
          [ -n "$v" ] || { echo "no FLUTTER_ENGINE_VERSION" >&2; exit 1; }
          echo "flutter_version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the bundle builder
        run: |
          docker build --build-arg FLUTTER_VERSION=${{ steps.pin.outputs.flutter_version }} \
            -t segno-bundle-build deploy/rpi/build

      - name: Build the profile bundle
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            segno-bundle-build --profile

      - name: Check FFI symbol parity
        run: packages/segno_engine/tool/check_ffi_symbols.sh build/appliance/profile-bundle/lib/libsegno_engine.so

      # The bundle is what deploy/rpi/profile-on-device.sh expects to be handed:
      # the whole directory, data/ and lib/, not a tarball of the repo.
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: segno-appliance-profile
          path: build/appliance/profile-bundle/
          if-no-files-found: error
          retention-days: 14
