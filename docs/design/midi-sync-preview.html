<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segno · Clock & sync review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c0d10;color:#dde1e8;font:16px Arial}header{display:flex;align-items:center;gap:24px;padding:16px 28px}header span{color:#939ba8;flex:1}a{color:#d4deef}#viewport{margin:0 24px;overflow:hidden}iframe{display:block;width:1920px;height:1080px;transform-origin:top left;border:0}#simulator{margin:20px 24px;display:flex;align-items:center;flex-wrap:wrap;gap:18px;padding:22px;background:#181b21;border:1px solid #404652;border-radius:12px}label{display:flex;align-items:center;gap:12px}select,button{background:#242934;color:#e6e9ef;border:1px solid #687183;border-radius:6px;padding:12px;font:inherit;min-height:44px}button{cursor:pointer}button:active{background:#464f60}input{width:170px}small{color:#9da7b5}#feedback{color:#aeb9cb;margin:0 26px 24px}</style>
<header><strong>Clock & sync</strong><span>Design proposal · simulated MIDI device</span><a href="fx-ux-prototype.html?review=sync-waiting">Open main prototype</a></header>
<div id="viewport"><iframe id="main" title="Segno prototype" src="fx-ux-prototype.html?review=sync-waiting&amp;canvas=actual"></iframe></div>
<section id="simulator" aria-label="External clock simulator"><strong>Other device</strong><select id="device" aria-label="Device"><option value="usb">USB controller</option><option value="din">MIDI In</option><option value="keys">Keyboard</option></select><label><output id="bpm">120 BPM</output><input id="tempo" aria-label="External tempo" type="range" min="40" max="220" value="120"></label><button id="clock">Send clock</button><button data-message="start">Play from start</button><button data-message="continue">Continue</button><button data-message="stop">Stop</button><button id="connect">Disconnect</button><small>No hardware or audio</small></section>
<p id="feedback">Send clock to establish tempo. Play and Stop are separate messages.</p>
<script>
const frame=document.getElementById('main'),device=document.getElementById('device'),tempo=document.getElementById('tempo'),clock=document.getElementById('clock'),feedback=document.getElementById('feedback');const api=()=>frame.contentWindow.segnoDemo;let timer=null;
function send(type){api()?.syncReceive(device.value,type);}
function run(){clearInterval(timer);let next=frame.contentWindow.performance.now();timer=setInterval(()=>{const now=frame.contentWindow.performance.now(),period=60000/(+tempo.value*24);if(now-next>1000)next=now;while(next<=now){api()?.syncReceive(device.value,'clock',next);next+=period;}},8);}
clock.onclick=()=>{if(timer){clearInterval(timer);timer=null;clock.textContent='Send clock';feedback.textContent='Clock interrupted. Segno will use the selected clock-loss behavior.';}else{run();clock.textContent='Interrupt clock';feedback.textContent='Sending clock. Change tempo here, or open Stage to see the loops.';}};
tempo.oninput=()=>{document.getElementById('bpm').textContent=tempo.value+' BPM';if(timer)run();};
document.querySelectorAll('[data-message]').forEach(b=>b.onclick=()=>{send(b.dataset.message);feedback.textContent=b.textContent+' sent. Follow Play / Stop determines whether Segno responds.';});
function connection(){const p=api()?.midiState().ports.find(p=>p.id===device.value);document.getElementById('connect').textContent=p?.online?'Disconnect':'Reconnect';}
device.onchange=connection;frame.onload=connection;document.getElementById('connect').onclick=()=>{const p=api().midiState().ports.find(p=>p.id===device.value);api().midiConnect(device.value,!p.online);connection();};
function resize(){const v=document.getElementById('viewport'),s=Math.min(1,v.clientWidth/1920);frame.style.transform='scale('+s+')';v.style.height=1080*s+'px';}new ResizeObserver(resize).observe(document.body);resize();
</script></html>
