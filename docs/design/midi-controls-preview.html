<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segno · MIDI controls review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c0d10;color:#dde1e8;font:16px Arial}header{display:flex;align-items:center;gap:24px;padding:16px 28px}header span{color:#939ba8;flex:1}a{color:#d4deef}#viewport{margin:0 24px;overflow:hidden}iframe{display:block;width:1920px;height:1080px;transform-origin:top left;border:0}#simulator{margin:20px 24px;display:flex;align-items:center;flex-wrap:wrap;gap:24px;padding:22px;background:#181b21;border:1px solid #404652;border-radius:12px}label{display:flex;align-items:center;gap:12px}select,button{background:#242934;color:#e6e9ef;border:1px solid #687183;border-radius:6px;padding:12px;font:inherit;min-height:44px}button{cursor:pointer}button:active{background:#464f60}input{width:200px}#feedback{font:14px monospace;color:#b2c0d4;margin:0 26px 24px}small{color:#9da7b5}</style>
<header><strong>MIDI controls</strong><span>Design proposal · simulated controller</span><a href="fx-ux-prototype.html?review=midi-list">Open main prototype</a></header>
<div id="viewport"><iframe id="main" title="Segno prototype" src="fx-ux-prototype.html?review=midi-list&amp;canvas=actual"></iframe></div>
<section id="simulator" aria-label="MIDI controller simulator"><strong>Controller simulator</strong><select id="device" aria-label="Controller"><option value="usb">USB controller</option><option value="din">MIDI In</option><option value="keys">Keyboard</option></select><label>Knob · CC 21<input id="knob" type="range" min="0" max="127" value="0"></label><button id="note">Button · Note 60</button><button id="program">Program 1</button><button id="connect">Disconnect</button><small>Channel 1 · no hardware or audio</small></section><p id="feedback">Select Add mapping, then move a control below to learn it.</p>
<script>
const frame=document.getElementById('main'),device=document.getElementById('device');const api=()=>frame.contentWindow.segnoDemo;
function send(kind,number,value){api()?.midiReceive(device.value,{kind,channel:1,number,value});document.getElementById('feedback').textContent=device.selectedOptions[0].text+' · '+kind.toUpperCase()+' '+number+' · Value '+value;}
document.getElementById('knob').oninput=e=>send('cc',21,+e.target.value);const note=document.getElementById('note');let held=false;note.onpointerdown=e=>{if(e.button!==0||held)return;held=true;note.setPointerCapture(e.pointerId);send('note',60,127);};function release(){if(!held)return;held=false;send('note',60,0);}note.onpointerup=release;note.onpointercancel=release;note.onlostpointercapture=release;note.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();held=true;send('note',60,127);}};note.onkeyup=e=>{if(e.key===' '||e.key==='Enter')release();};window.onblur=release;device.onchange=()=>{const p=api()?.midiState().ports.find(p=>p.id===device.value);document.getElementById('connect').textContent=p?.online?'Disconnect':'Reconnect';};document.getElementById('program').onclick=()=>send('program',1,127);document.getElementById('connect').onclick=e=>{release();const p=api().midiState().ports.find(p=>p.id===device.value);api().midiConnect(device.value,!p.online);e.target.textContent=p.online?'Reconnect':'Disconnect';};function resize(){const v=document.getElementById('viewport'),s=Math.min(1,v.clientWidth/1920);frame.style.transform='scale('+s+')';v.style.height=1080*s+'px';}new ResizeObserver(resize).observe(document.body);resize();
</script></html>
