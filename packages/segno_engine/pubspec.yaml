name: segno_engine
description: >-
  Native low-latency duplex audio engine for Segno, wrapping a hand-written
  miniaudio looping core via Dart FFI.
version: 0.1.0
publish_to: none
license: GPL-3.0-or-later

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  ffigen: ^18.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  # The vendored native code's license texts, verbatim, for the app's
  # open source notices (registerVendoredLicenses).
  assets:
    - third_party/clap/LICENSE
    - src/miniaudio/LICENSE
    - third_party/rnnoise/COPYING
    - third_party/signalsmith-stretch/dsp/LICENSE.txt
    - third_party/signalsmith-stretch/LICENSE.txt
    - third_party/vst3sdk/base/LICENSE.txt
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
