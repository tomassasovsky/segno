name: controller_repository
description: >-
  Controller sources for Segno: forwards console CTRL events and provides
  the MIDI mapping model (decoder and mapping engine) the app's controls use.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
