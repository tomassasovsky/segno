name: operation_guards
description: >-
  One table of which appliance operations may commit while others are in
  flight (capture, session apply and write, USB transfer and eject, audio
  device change, calibration, restart), checked at each operation's commit
  point. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.2.0
