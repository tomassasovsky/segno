name: instrument_repository
description: >-
  Owns Segno's instruments (#1197): persistent definitions with stable
  identities and engine slots, the MIDI routing table compiler, auditions and
  parameter drafts, and the replay of every slot after an engine reset.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  segno_engine:
    path: ../segno_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
