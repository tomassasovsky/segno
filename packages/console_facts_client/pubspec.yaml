name: console_facts_client
description: >-
  Data client for the facts only the Segno appliance image knows about itself:
  disk usage, the console's serial number, image build, panel names, last
  board flash, and leftover Bluetooth pairings. Pure Dart; no Flutter
  dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  equatable: ^2.1.0
  meta: ^1.16.0

dev_dependencies:
  fake_async: ^1.3.0
  test: ^1.25.0
  very_good_analysis: ^10.2.0
