name: wifi_client
description: >-
  Data client for Segno appliance WiFi (`segno-wifi-ctl`). Pure Dart: it
  starts the helper with spawn_process (posix_spawn, never fork) and parses
  its JSON; no Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0

dependencies:
  equatable: ^3.0.0
  meta: ^1.16.0
  spawn_process:
    path: ../spawn_process

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^11.0.0
