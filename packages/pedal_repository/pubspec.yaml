name: pedal_repository
description: >-
  Pedal layer for the Segno console board: state-frame models and the binary
  link codec that segno and the board's Pico 2 firmware share as a single
  contract, over the appliance's link UART.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  equatable: ^2.0.7
  ffi: ^2.1.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
