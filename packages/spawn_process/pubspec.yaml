name: spawn_process
description: >-
  Starts helper programs with posix_spawn through dart:ffi, so the app never
  forks itself: on the appliance a fork() of the app stalls the real-time audio
  thread (#1367). Pure Dart; no Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.1.3

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.2.0
