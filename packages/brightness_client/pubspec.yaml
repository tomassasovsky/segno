name: brightness_client
description: >-
  Data client for Segno appliance display brightness (`segno-brightness-ctl`).
  Pure Dart: it starts the helper with spawn_process (posix_spawn, never
  fork) and parses its JSON; no Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  meta: ^1.16.0
  spawn_process:
    path: ../spawn_process
  toml: ^0.18.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.2.0
