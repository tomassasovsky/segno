name: settings_repository
description: >-
  Persists Segno's settings (audio configuration and latency calibration,
  monitoring, tempo and recording choices, pedal and MIDI configuration,
  displays) via a key-value store.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  flutter:
    sdk: flutter
  local_storage_client:
    path: ../local_storage_client
  pub_semver: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
