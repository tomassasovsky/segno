name: storage_repository
description: >-
  The one owner of where a write may go on the Segno appliance: Internal and
  removable USB volumes, their capacity (the engine's statvfs), who is writing
  (leases), whether a drive may be ejected, and a copy that leaves existing
  content intact on every failure. Depends on segno_engine for VolumeSpace and
  on usb_storage_client; never on the UI.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  meta: ^1.16.0
  operation_guards:
    path: ../operation_guards
  segno_engine:
    path: ../segno_engine
  usb_storage_client:
    path: ../usb_storage_client
dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
