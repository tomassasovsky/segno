name: usb_storage_client
description: >-
  Data client for the Segno appliance's removable USB volumes: reads the JSON
  that `segno-usb-ctl` writes under /run/segno/usb (watched with inotify, no
  polling and no subprocess) and files eject requests. Pure Dart; no Flutter
  dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  equatable: ^2.1.0
  meta: ^1.16.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.2.0
