# Test configuration for the segno app.
#
# Declare the `screenshots` tag so package:test does not warn about it. The
# screenshot suites in test/screenshots/ render PNGs for review against the
# design; no goldens are committed, so they self-skip in-test unless run with
# `--update-goldens` (see rendersScreenshots in test/helpers). CI renders them
# and uploads the PNGs as the `screenshots` artifact. No unconditional skip is
# configured here: that would also block an explicit `--tags screenshots` run.
tags:
  screenshots:
  # The control-sequence fuzzer (test/fuzz/): drives the REAL native engine,
  # which segno_engine's build hook builds for every test run, through the
  # device-free pump.
  fuzz:
