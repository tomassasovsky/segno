include:
  - package:very_good_analysis/analysis_options.yaml
  - package:bloc_lint/recommended.yaml
analyzer:
  exclude:
    - lib/l10n/gen/*
    - build/**
    - ios/**
    - macos/**
linter:
  rules:
    public_member_api_docs: false

# very_good_analysis 11 switched trailing commas to automate; the code is
# written with them preserved, as 10.x formatted it.
formatter:
  trailing_commas: preserve
