# OpenOCD: SWD to the console board's Pico 2 through the Pi 5's own GPIO, over the
# J2 ribbon. Pi GPIO24 = SWCLK (ribbon pin 18), GPIO25 = SWDIO (pin 22).
#
# Uses Raspberry Pi's own raspberrypi5-gpiod.cfg (finds the RP1 gpiochip from the
# device tree) and overrides its default pins, which are 11/8, with the board's.
# GPIO25 is pulled DOWN by the Pi's firmware by default and SWDIO wants a pull-up:
# put `gpio=25=pu` in config.txt, or the idle line sits mid-rail.
source [find interface/raspberrypi5-gpiod.cfg]
adapter gpio swclk -chip $_GPIO_CHIP 24
adapter gpio swdio -chip $_GPIO_CHIP 25
transport select swd
source [find target/rp2350.cfg]
