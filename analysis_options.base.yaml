# The lint set the app and every package under packages/ share. Each
# analysis_options.yaml includes this file and adds only its own excludes.
include: package:very_good_analysis/analysis_options.yaml

# very_good_analysis 11 formats with trailing_commas: automate. The code is
# written with trailing commas preserved, as 10.x formatted it.
formatter:
  trailing_commas: preserve

linter:
  rules:
    # Two Dart 3.13 rules that only swap one spelling for another: `new(...)`
    # for a constructor named after its class, and `;` for an empty `{}`
    # body. Neither makes the code shorter in any way that matters, and
    # rewriting two thousand declarations would conflict with every open
    # branch.
    unnecessary_type_name_in_constructor: false
    empty_container_bodies: false
