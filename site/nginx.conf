# Serves the static site on port 80. In production the segno-updates nginx
# proxies "/" here and keeps /updates/, /hooks/sync and /healthz for itself.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain;

    # `expires` sets Cache-Control without add_header, so these headers apply
    # to every location below. TLS ends at Nginx Proxy Manager; browsers
    # ignore HSTS over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    error_page 404 /404.html;

    # Pages revalidate on every visit. Assets are referenced with ?v=<hash>
    # (site/stamp.py), so a changed file gets a new URL and can be cached for
    # a year.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location ~* \.(css|webp|jpg|png|woff2|svg)$ {
        expires 1y;
    }
}
